:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nb:T4,slug12:T4,slug2a:I[104349,[\"/_next/static/immutable/chunks/3ui6yqd7tf3d6.js\",\"/_next/static/immutable/chunks/1snhgu9z95f_z.js\",\"/_next/static/immutable/chunks/1tmtyuq61n_y7.js\",\"/_next/static/immutable/chunks/1973e243usi1b.js\",\"/_next/static/immutable/chunks/2m_1wgsxbco85.js\",\"/_next/static/immutable/chunks/24bcvrudzk37z.js\",\"/_next/static/immutable/chunks/3hl9s_1d48to2.js\",\"/_next/static/immutable/chunks/391pkswcqedbw.js\",\"/_next/static/immutable/chunks/0ko7auihb_oce.js\",\"/_next/static/immutable/chunks/3j6ykk8t5c6j-.js\",\"/_next/static/immutable/chunks/2dgh2-9kumq88.js\",\"/_next/static/immutable/chunks/34ej0hekyh5zt.js\",\"/_next/static/immutable/chunks/2zpykabmwlb4g.js\"],\"default\"]\n22:[\"$\",\"$24\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"h-dvh animate-pulse bg-panel\"}],\"children\":[\"$\",\"$L2a\",null,{\"entry\":{\"slug\":\"data-grid\",\"name\":\"DataGrid\",\"category\":\"Power-User Systems\",\"addedAt\":\"2026-09-18\",\"pro\":false,\"description\":\"A virtualised grid over thousands of rows: resizable columns, multi-key sorting, range selection and keyboard navigation. Header and body share one scroller so they can never desync, selection is keyed by row id so it survives a re-sort, and focus stays on the viewport so a recycled row can never take the arrow keys down with it. Give it a parent with a bounded height — like every windowing implementation, in an auto-height parent it quietly stops windowing and renders every row.\",\"dependencies\":[\"lucide-react\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Skeleton / Shimmer\",\"Layout thrashing\",\"Frame rate (FPS)\",\"Spatial consistency\",\"Frequency of use\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/data-grid.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/types.ts\",\"role\":\"peer\",\"label\":\"types.ts\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/util.ts\",\"role\":\"peer\",\"label\":\"util.ts\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/use-columns.ts\",\"role\":\"peer\",\"label\":\"use-columns.ts\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/use-virtual-rows.ts\",\"role\":\"peer\",\"label\":\"use-virtual-rows.ts\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/header-row.tsx\",\"role\":\"peer\",\"label\":\"header-row.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/body-rows.tsx\",\"role\":\"peer\",\"label\":\"body-rows.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/data-grid/skeleton-rows.tsx\",\"role\":\"peer\",\"label\":\"skeleton-rows.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"lib/utils.ts\",\"role\":\"util\",\"label\":\"utils.ts\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"rowHeight\",\"kind\":\"number\",\"default\":34,\"min\":22,\"max\":72,\"step\":2,\"unit\":\"px\",\"description\":\"Height of one row. Fixed rather than measured, and that is the whole performance story — a constant height makes the first visible row a division instead of a search, so scrolling to row 90,000 costs exactly what scrolling to row 3 costs.\"},{\"name\":\"headerHeight\",\"kind\":\"number\",\"default\":34,\"min\":24,\"max\":64,\"step\":2,\"unit\":\"px\",\"description\":\"Height of the header. It shares the body's scroller, so this is also the offset the window calculation has to subtract from `scrollTop` — get it wrong and the rendered slice lags the scroll by exactly one header.\"},{\"name\":\"overscan\",\"kind\":\"number\",\"default\":6,\"min\":0,\"max\":30,\"step\":1,\"description\":\"Extra rows rendered above and below the fold. At 0 you can out-scroll the renderer and see white bands at the leading edge; past about fifteen you are paying for rows nobody will reach before they are recycled.\"},{\"name\":\"minColumnWidth\",\"kind\":\"number\",\"default\":80,\"min\":40,\"max\":240,\"step\":4,\"unit\":\"px\",\"description\":\"Floor a column can be dragged to. Without one a column can be collapsed to nothing and then cannot be grabbed again, because the handle it would be grabbed by has no width either.\"},{\"name\":\"stickyHeader\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Pin the header while the body scrolls. It sits inside the same scroller rather than in a second one kept in sync by hand — that synchronisation is never actually synchronous, and the header lagging the body on a fast horizontal flick is its signature.\"},{\"name\":\"resizableColumns\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Allow dragging column edges. The handle is a sibling of the sort button, not a child: nested, every resize would end by firing a click on the header and re-sorting the grid you were only trying to widen.\"},{\"name\":\"sortable\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Allow clicking a header to sort. The cycle has three states — ascending, descending, unsorted — because without the third there is no way back to the order the data arrived in, and for a feed that is most-recent-first one click destroys it permanently.\"},{\"name\":\"multiSort\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Shift-click a second header to sort by it as a tiebreak. The rank is printed beside each arrow: two arrows with no numbers do not say which key is primary, and that is the entire difference between two different orderings.\"},{\"name\":\"selectionMode\",\"kind\":\"enum\",\"default\":\"range\",\"options\":[\"none\",\"single\",\"range\"],\"description\":\"How rows may be selected. Range adds S
