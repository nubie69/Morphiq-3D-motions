:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

"What is poured into the letterforms. Each is a different branch over the same glyph mask, so switching is a uniform change and never a relayout — the type does not move when the material does.\"},{\"name\":\"flowSpeed\",\"kind\":\"number\",\"default\":0.4,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"Rate the material flows. At zero it sets, which is the only way to judge the fill on its own rather than the motion carrying it.\"},{\"name\":\"scale\",\"kind\":\"number\",\"default\":1.6,\"min\":0.3,\"max\":6,\"step\":0.1,\"description\":\"Size of the material's features relative to the type. Under about one the pattern is larger than the word and the letters read as flat colour; over three it turns to grain inside the strokes and the word stops being legible before it stops being pretty.\"},{\"name\":\"sweep\",\"kind\":\"number\",\"default\":0.8,\"min\":0,\"max\":3,\"step\":0.05,\"unit\":\"s\",\"description\":\"How long the material takes to pour across the line on mount. The wipe runs in the shader against the glyph's own horizontal position, so it follows the letterforms rather than being a rectangle crossing them. Zero fills instantly.\"},{\"name\":\"glow\",\"kind\":\"number\",\"default\":0.4,\"min\":0,\"max\":1.5,\"step\":0.05,\"description\":\"Bloom bleeding past the glyph edge. It is sampled from the mask around each fragment rather than by blurring the material, so the halo belongs to the letterform instead of to whatever colour happened to sit next to it. Past about one the letters fatten and the counters close up.\"},{\"name\":\"grain\",\"kind\":\"number\",\"default\":0.15,\"min\":0,\"max\":0.6,\"step\":0.05,\"description\":\"Dither over the fill. A smooth gradient inside a letterform bands on an eight-bit display more visibly than almost anywhere else, because there is a hard edge right beside it for the eye to compare against.\"},{\"name\":\"warp\",\"kind\":\"number\",\"default\":0.25,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\ ent, which is where the whole effect comes from.\"},{\"name\":\"jumpHeight\",\"kind\":\"number\",\"default\":26,\"min\":0,\"max\":90,\"step\":2,\"unit\":\"px\",\"description\":\"Peak of the jump.\"},{\"name\":\"anticipation\",\"kind\":\"number\",\"default\":7,\"min\":0,\"max\":30,\"step\":1,\"unit\":\"px\",\"description\":\"Depth of the wind-up before the launch, in spring travel. Spent as compression rather than as downward movement — the floor is real, and a body loading its spring squats instead of sinking.\"},{\"name\":\"windUp\",\"kind\":\"number\",\"default\":130,\"min\":0,\"max\":500,\"step\":10,\"unit\":\"ms\",\"disabledWhen\":{\"prop\":\"anticipation\",\"equals\":0},\"description\":\"How long the wind-up takes.\"},{\"name\":\"squash\",\"kind\":\"number\",\"default\":0.62,\"min\":0,\"max\":1.5,\"step\":0.02,\"description\":\"How hard velocity and floor contact deform a body. At 0 the type is rigid and still jumps — which is precisely what weightless motion looks like.\"},{\"name\":\"stagger\",\"kind\":\"number\",\"default\":34,\"min\":0,\"max\":160,\"step\":2,\"unit\":\"ms\",\"description\":\"Delay between one body launching and the next. At 0 the line moves as a slab; the offset is what makes it read as a row of separate objects.\"},{\"name\":\"interval\",\"kind\":\"number\",\"default\":2400,\"min\":200,\"max\":6000,\"step\":100,\"unit\":\"ms\",\"disabledWhen\":{\"prop\":\"trigger\",\"equals\":\"hover\"},\"description\":\"Rest between one pass finishing and the next beginning.\"},{\"name\":\"trigger\",\"kind\":\"enum\",\"default\":\"loop\",\"options\":[\"loop\",\"hover\"],\"description\":\"What starts a pass. Hover also answers focus and touch — a pointer-only trigger is half a component.\"},{\"name\":\"split\",\"kind\":\"enum\",\"default\":\"character\",\"options\":[\"character\",\"word\"],\"description\":\"Whether a body is one glyph or one whole word.\"},{\"name\":\"shadow\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Contact shadow under each body, tightening as it rises. Without it a jump is ambiguous with a slide.\"},{\"name\":\"accentColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"disabledWhen\":{\"prop\":\"shadow\",\"equals\":false},\"description\":\"The contact shadow.\"}]},\"next\":{\"slug\":\"stretch-type\",\"name\":\"StretchType\",\"category\":\"Text Animations\",\"addedAt\":\"2026-09-18\",\"pro\":false,\"description\":\"Type that deforms with how fast you are scrolling rather than how far. Each glyph springs toward the same velocity signal on a softer spring than the one before it, so the wave down the word is a consequence of the physics instead of a list of delays — change the string and it re-tunes itself.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Scroll-driven animation\",\"Velocity\",\"Squash & stretch\",\"Spring\",\"Momentum\",\"Skew\",\"Interruptible animation\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/stretch-type/stretch-type.tsx\"},\"$22:props:children:props:neighbors:prev:variants:1\"],\"props\":[{\"name\":\"stretch\",\"kind\":\"number\",\"default\":0.55,\"min\":0,\"max\":1.5,\"step\":0.05,\"description\":\"How far the leading glyph deforms at full velocity. The opposite axis gives up two thirds of what this gains — a full reciprocal preserves the area exactly and reads as the letter being squeezed through a gap rather than pulled.\"},{\"name\":\"skew\",\"kind\":\"number\",\"default\":12,\"min\":0,\"max\":40,\"step\":1,\"unit\":\"°\",\"description\":\"Degrees of lean at full velocity. Signed off the scroll direction, so scrolling back up leans the word the other way — this is what stops a fast reversal from looking like the same animation replayed.\"},{\"name\":\"tracking\",\"kind\":\"number\",\"default\":0.12,\"min\":0,\"max\":0.5,\"step\":0.01,\"unit\":\"em\",\"description\":\"Extra letter-spacing at full velocity. Unsigned, because the word should open up in both directions — spacing that closed o
