:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

shold matrix decides each cell. Bayer is the ordered one — a fixed lattice, so the texture is stable and never crawls between frames. Halftone rotates the grid forty-five degrees and clusters instead of scattering, which is what a printing press does. Noise drops the lattice entirely and pays for it with a pattern that shimmers the moment anything moves.\"},{\"name\":\"levels\",\"kind\":\"number\",\"default\":2,\"min\":2,\"max\":8,\"step\":1,\"description\":\"Tones per channel after quantisation. Two is the honest one-bit case. Above four this stops being dithering and starts being a slightly cheap gradient — worth dragging once to see exactly where the effect stops earning its name.\"},{\"name\":\"pixelSize\",\"kind\":\"number\",\"default\":3,\"min\":1,\"max\":12,\"step\":1,\"unit\":\"px\",\"description\":\"Size of one dither cell, held in CSS pixels rather than device pixels. Held in device pixels the grid would halve on a retina screen and the effect would vanish on exactly the displays people judge it on.\"},{\"name\":\"field\",\"kind\":\"enum\",\"default\":\"plasma\",\"options\":[\"plasma\",\"ridges\",\"tunnel\",\"drift\"],\"description\":\"What is being quantised underneath. The dither is indifferent to it — that is the point of a threshold matrix — but the four differ sharply in how much smooth gradient they hand it, and a pattern only shows its character on a gradient.\"},{\"name\":\"fieldSpeed\",\"kind\":\"number\",\"default\":0.3,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"Rate the field evolves. At zero it parks, which is the clearest way to see the threshold matrix itself rather than the image passing through it.\"},{\"name\":\"fieldScale\",\"kind\":\"number\",\"default\":2.4,\"min\":0.5,\"max\":8,\"step\":0.1,\"description\":\"Size of the field's features relative to the container. Small enough and the whole panel is one tone with nothing for the dither to resolve; large enough and every cell disagrees with its neighbour and the pattern turns to static.\"},{\"name\":\"frameHold\",\"kind\":\"number\",\"default\":0,\"min\":0,\"max\":8,\"step\":1,\"unit\":\"frames\",\"description\":\"How many frames the field is held before it advances. Zero runs at display rate; three gives the deliberate stutter of a machine that could not keep up. The frame is still drawn either way and the held time is spent in one go when the hold expires — so this is a look, not a saving, and not a speed control in disguise.\"},{\"name\":\"contrast\",\"kind\":\"number\",\"default\":1,\"min\":0.2,\"max\":3,\"step\":0.05,\"description\":\"Contrast applied around mid-grey before quantisation. This is the real control over how much of the field survives: at two levels there is exactly one threshold, so pushing contrast up does not brighten the image, it decides where the edge between black and white falls.\"},{\"name\":\"inkColor\",\"kind\":\"color\",\"default\":\"#e8e4d8\",\"description\":\"The colour a lit cell takes. Warm off-white rather than pure white on purpose — a true #ffffff against near-black is the one pairing that makes the grid buzz.\"},{\"name\":\"paperColor\",\"kind\":\"color\",\"default\":\"#0b0b0d\",\"description\":\"The colour an unlit cell takes.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"moire\",\"name\":\"Moire\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-09-18\",\"pro\":false,\"pausable\":true,\"description\":\"Two lattices stacked at a fraction of a degree apart, beating against each other into live interference fringes. Every layer is band-limited in the shader, so what you see is the interference and not the sampling.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Idle animation\",\"Rotate\",\"Hover effect\",\"Hardware acceleration\",\"Linear\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/moire/moire.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"lattice\",\"kind\":\"enum\",\"default\":\"lines\",\"options\":[\"lines\",\"grid\",\"dots\",\"rings\"],\"description\":\"Shape of the two stacked layers. Lines beat into banding, grid into a woven plaid, dots into a rosette, rings into a bullseye that walks as you move.\"},{\"name\":\"pitch\",\"kind\":\"number\",\"default\":9,\"min\":3,\"max\":40,\"step\":0.5,\"unit\":\"px\",\"description\":\"Spacing of one lattice cell, in CSS pixels. Widen it and the beat frequency drops — the fringes get broader and travel slower even though nothing else changed.\"},{\"name\":\"angle\",\"kind\":\"number\",\"default\":3.2,\"min\":0,\"max\":45,\"step\":0.1,\"unit\":\"°\",\"description\":\"Rotation between the two layers. This is the whole effect: at 0° they stack invisibly, and a tenth of a degree either side sweeps the fringes across the entire field.\"},{\"name\":\"drift\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":3,\"step\":0.05,\"unit\":\"×\",\"description\":\"How far the angle and offset breathe on their own. 0 holds one still interference pattern, which is the honest setting to put behind body copy.\"},{\"name\":\"separation\",\"kind\":\"number\",\"default\":6,\"min\":0,\"max\":40,\"step\":1,\"unit\":\"px\",\"description\":\"Offset between the layers — a second beat axis independent of angle, so the fringes shift without rotating.\"},{\"name\":\"thickness\",\"kind\":\"number\",\"default\":0.16,\"min\":0.05,\"max\":0.95,\"step\":0.01,\"description\":\"How much of a lattice cell is ink. Kept low by default so the field stays dark enough to put content on; push it past 0.5 and the two layers cover almost everything, which is a wall rather than a background.\"},{\"name\":\"contrast\",\"kind\":\"number\",\"default\":1,\"min\":0.2,\"max\":2.5,\"step\":0.05,\"unit\":\"×\",\"description\":\"How hard the fringes clip toward light and dark, expanded around the pattern's own mean rather than mid-grey. Above about 1.6 the soft beat becomes hard banding.\"},{\"n
