:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

 so mid-tones resolve into the organic scattered grain of a stippled engraving instead of a fixed lattice. Atkinson forwards only three-quarters of the error, which is why the classic-Mac look keeps its blown highlights. Floyd–Steinberg and Sierra spread all of it for a smoother ramp. The field is diffused on the CPU into an ImageData at one cell per CSS pixel-group, then scaled up with smoothing off, so the grid survives retina intact.\",\"dependencies\":[],\"cookbook\":[\"Loop\",\"Stepped animation\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/stipple/stipple.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"algorithm\",\"kind\":\"enum\",\"default\":\"atkinson\",\"options\":[\"atkinson\",\"floyd-steinberg\",\"sierra\"],\"description\":\"Error-diffusion kernel. Atkinson drops a quarter of the error for punchy highlights; Floyd–Steinberg is the textbook 4-tap spread; Sierra pushes across three rows for the smoothest grain.\"},{\"name\":\"pixelSize\",\"kind\":\"number\",\"default\":4,\"min\":2,\"max\":12,\"step\":1,\"unit\":\"px\",\"description\":\"CSS pixels per dither cell. The grid is measured in CSS pixels so a retina screen doesn't silently halve the cells.\"},{\"name\":\"fieldScale\",\"kind\":\"number\",\"default\":2,\"min\":0.5,\"max\":6,\"step\":0.1,\"description\":\"Spatial scale of the underlying luminance field.\"},{\"name\":\"speed\",\"kind\":\"number\",\"default\":0.25,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"Flow speed of the field. Zero freezes the pattern without blanking it.\"},{\"name\":\"contrast\",\"kind\":\"number\",\"default\":1.1,\"min\":0.2,\"max\":3,\"step\":0.05,\"description\":\"Contrast curve applied around mid-grey before quantization — low values are all grain, high values are all shape.\"},{\"name\":\"serpentine\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Alternate the scan direction per row. One-way scans drag directional worm artifacts across flat regions; the boustrophedon hides them.\"},{\"name\":\"ink\",\"kind\":\"color\",\"default\":\"#c4b5fd\",\"description\":\"The quantized on tone.\"},{\"name\":\"paper\",\"kind\":\"color\",\"default\":\"#0b0812\",\"description\":\"The quantized off tone.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"rainglass\",\"name\":\"Rainglass\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-08-14\",\"pausable\":true,\"description\":\"Rain on a window with a city somewhere behind it. There is no scene being blurred. The backdrop is built out of focus to begin with, so the drops have something to bend without a render target or a blur pass anywhere in the frame. Each drop is a pure function of time inside its own grid cell, which is why a thousand of them cost the same as one and a resize cannot lose the rain. They descend the way water actually does: holding by surface tension, breaking loose, running fast, stopping again. The trail exists only above the drop that made it.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Idle animation\",\"Blur\",\"Hardware acceleration\",\"Compositing\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/rainglass/rainglass.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"intensity\",\"kind\":\"number\",\"default\":0.55,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How much water is on the glass. Cells are gated by this rather than dimmed by it — a cell either has a drop in it or it does not, because a half-present drop reads as a smudge on the screen rather than as weather.\"},{\"name\":\"dropScale\",\"kind\":\"number\",\"default\":1,\"min\":0.5,\"max\":2,\"step\":0.05,\"description\":\"Drop size, by way of the grid the drops live in. Large drops means fewer, heavier runs and a window you are standing close to; small means a fine spatter that reads as distance.\"},{\"name\":\"speed\",\"kind\":\"number\",\"default\":1,\"min\":0.2,\"max\":3,\"step\":0.05,\"description\":\"How often a drop breaks loose, and how fast it runs once it has. Because the descent is a held stair rather than a fall, raising this shortens the holds as much as it quickens the slips.\"},{\"name\":\"wander\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How far a running drop drifts sideways as it goes. At zero they run dead straight down, which is the one thing real water on glass never does.\"},{\"name\":\"refraction\",\"kind\":\"number\",\"default\":0.6,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How hard each droplet bends the city behind it. The offset points out of the droplet's own centre, so this magnifies rather than smears — turn it off and the drops flatten into stickers on the glass.\"},{\"name\":\"fog\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Condensation film over the whole pane. It is removed by what the water has touched rather than drawn between the drops, so a trail is a clean stripe cut through the fog instead of a shape sitting on top of it.\"},{\"name\":\"layers\",\"kind\":\"number\",\"default\":2,\"min\":1,\"max\":3,\"step\":1,\"description\":\"Depth planes of rain, each smaller and refracting less than the one in front. Two is enough to read as depth; the third is texture and costs a full extra evaluation of the drop field per pixel.\"},{\"name\":\"blur\",\"kind\":\"number\",\"default\":0.65,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How far out of focus the city is. This grows the bokeh discs rather than running a kernel over a rendered scene — there is nothing sharp behind the glass to soften, which is the whole reason this stays a single pass.\"},{\"name\":\"tintTop\",\"kind\":\"color\",\"default\":\"#241436\",\"description\":\"Sky, at the top of the frame.\"},{\"name\":\"tintBottom\",\"kind\":\"color\",\"default\":\"#0b0b12\",\"description\":\"Ground, at the bottom.\"},{\"name\":\"glow\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The out-of-focus lights, and the highlight that catches on a wet edge.\"}]},\"next\":{\"slug\":\"prism\",\"name\":\"Prism\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-08-21\",\"pausable\":true,\"description\":\"A raymarched glass prism splitting a beam into its spectrum. An SDF solid turned in a hazy volume, a white shaft entering one face and a fan of spectral bands leaving another, each band bent by its own wavelength-dependent deviation so the fan spreads the way dispersion actually spreads. The beams are analytic capsule glows integrated against the view ray, not a second march, which is what keeps sixty-four steps and eight bands inside a frame budget. Drag orbits the solid with momentum. The haze is what makes the shafts readable at all, because light in clean air is invisible until it hits something.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Orbit\",\"Drag\",\"Momentum\",\"Loop\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/prism/prism.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"dispersion\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Wavelength spread across the fan — zero collapses the spectrum back into one refracted shaft.\"},{\"name\":\"bands\",\"kind\":\"number\",\"default\":6,\"min\":3,\"max\":8,\"step\":1,\"description\":\"Spectral samples in the exit fan.\"},{\"name\":\"beamIntensity\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":3,\"step\":0.1,\"description\":\"Brightness of the shaft and the fan together.\"},{\"name\":\"beamColor\",\"kind\":\"color\",\"default\":\"#ffffff\",\"description\":\"Tint of the incoming shaft.\"},{\"name\":\"saturation\",\"kind\":\"number\",\"default\":0.9,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Spectral saturation of the fan — zero washes every band back to the beam color.\"},{\"name\":\"fog\",\"kind\":\"number\",\"default\":0.3,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Density of the participating haze. The beams are only as visible as the air is dirty.\"},{\"name\":\"autoRotate\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Idle turn; a drag takes over and momentum hands back.\"},{\"name\":\"rotateSpeed\",\"kind\":\"number\",\"default\":0.3,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"disabledWhen\":{\"prop\":\"autoRotate\",\"equals\":false},\"description\":\"Idle rotation rate.\"}]},\"index\":23,\"total\":137},\"controlsLocked\":\"$@2b\"}]}]\n"])</script><script>self.__next_f.push([1,"25:null\n"])</script><script>self.__next_f.push([1,"29:[[\"$\",\"title\",\"0\",{\"children\":\"Stipple :: Fullscreen :: Motion Garden\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A flowing luminance field crushed to ink and paper by error diffusion. Each cell's quantization error is pushed onto its unvisited neighbours in a serpentine scan, so mid-tones resolve into the organic scattered grain of a stippled engraving instead of a fixed lattice. Atkinson forwards only three-quarters of the error, which is why the classic-Mac look keeps its blown highlights. Floyd–Steinberg and Sierra spread all of it for a smoother ramp. The field is diffused on the CPU into an ImageData at one cell per CSS pixel-group, then scaled up with smoothing off, so the grid survives retina intact.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Motion Garden\"}],[\"$\",\"link\",\"3\",{\"rel\":\"author\",\"href\":\"https://shadow-garden-ui.vercel.app\"}],[\"$\",\"meta\",\"4\",{\"name\":\"author\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"5\",{\"name\":\"keywords\",\"content\":\"react animation components,react
