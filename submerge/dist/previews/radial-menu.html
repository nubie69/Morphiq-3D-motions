:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

,\"unit\":\"px\",\"description\":\"How far the options sit from the press point. Only the drawing distance — selection is angular, so a wide radius costs nothing in accuracy and a tight one buys none.\"},{\"name\":\"startAngle\",\"kind\":\"number\",\"default\":180,\"min\":0,\"max\":359,\"step\":5,\"unit\":\"°\",\"description\":\"Where the first option lands. 0 is right and 90 is down, following screen coordinates rather than the maths convention — the y axis on a page points the other way and pretending otherwise makes every later value read backwards.\"},{\"name\":\"sweep\",\"kind\":\"number\",\"default\":180,\"min\":60,\"max\":360,\"step\":10,\"unit\":\"°\",\"description\":\"Total arc the options are spread across. At a full turn the last option would land on the first, so the spacing switches from end-to-end to evenly-around at 360 — the one place this component has two layout rules.\"},{\"name\":\"itemCount\",\"kind\":\"number\",\"default\":6,\"min\":2,\"max\":7,\"step\":1,\"description\":\"How many options to show. Past about seven the wedges get narrower than the flick they are meant to catch, which is the point at which a list would serve you better.\"},{\"name\":\"holdDelay\",\"kind\":\"number\",\"default\":220,\"min\":0,\"max\":800,\"step\":20,\"unit\":\"ms\",\"description\":\"How long the press has to be held before the fan opens. Releasing sooner is treated as a plain click on whatever is underneath, so the surface stays usable for its normal purpose. At 0 the menu opens on contact and that normal purpose is gone.\"},{\"name\":\"stagger\",\"kind\":\"number\",\"default\":0.03,\"min\":0,\"max\":0.12,\"step\":0.005,\"unit\":\"s\",\"description\":\"Delay between one option arriving and the next. Small values read as the fan unrolling; large ones make you wait for the option you already know you want.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":380,\"min\":100,\"max\":900,\"step\":10,\"description\":\"How hard the options spring out to their positions.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":26,\"min\":8,\"max\":60,\"step\":1,\"description\":\"How fast that spring settles. Low values overshoot the arc and snap back, which reads as the options being flung rather than placed.\"},{\"name\":\"centerCancel\",\"kind\":\"number\",\"default\":28,\"min\":0,\"max\":80,\"step\":2,\"unit\":\"px\",\"description\":\"Radius of the dead zone around the press point. Release inside it and nothing commits. At 0 a press that never really moved still resolves to whichever option is nearest the jitter, and the menu picks something you never chose.\"},{\"name\":\"accent\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"Highlight on the option the pointer is aimed at, and on the label echoing it back at the centre.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"magnetic-dock\",\"name\":\"MagneticDock\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-09-18\",\"pro\":false,\"description\":\"A dock whose items swell under the pointer and carry their neighbours part of the way with them. One shared value drives the whole row, so nothing re-renders while you sweep across it — and focusing an item writes the same value, which is why the keyboard gets the identical effect rather than a substitute for it.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Hover effect\",\"Spring\",\"Stiffness / Tension\",\"Damping\",\"Spatial consistency\",\"Follow-through\",\"Purposeful animation\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/magnetic-dock/magnetic-dock.tsx\"},\"$22:props:children:props:entry:variants:1\"],\"props\":[{\"name\":\"magnification\",\"kind\":\"number\",\"default\":2,\"min\":1,\"max\":3.5,\"step\":0.05,\"unit\":\"×\",\"description\":\"How far the item directly under the pointer grows past its resting size. Past about 2.5 the peak stops looking like the row lifting and starts looking like one icon detaching from it.\"},{\"name\":\"falloff\",\"kind\":\"number\",\"default\":140,\"min\":40,\"max\":320,\"step\":5,\"unit\":\"px\",\"description\":\"Distance at which an item stops responding at all. This is the real character knob: a narrow falloff magnifies one item and reads as a hover state, while a wide one pulls four or five along and reads as a surface being pushed from underneath.\"},{\"name\":\"baseSize\",\"kind\":\"number\",\"default\":44,\"min\":28,\"max\":72,\"step\":2,\"unit\":\"px\",\"description\":\"Resting edge length of an item. The icon is sized in `em` off this, so any node scales with it without knowing the dock exists.\"},{\"name\":\"gap\",\"kind\":\"number\",\"default\":10,\"min\":0,\"max\":28,\"step\":1,\"unit\":\"px\",\"description\":\"Space between items at rest. Items grow into this gap rather than pushing each other along, so a tight dock has the peak crowding its neighbours and a loose one lets each swell finish.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":320,\"min\":80,\"max\":800,\"step\":10,\"description\":\"How hard an item springs toward its target size. Low values put the largest item visibly behind the pointer on a fast sweep, which breaks the illusion that you are pushing the surface yourself.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":24,\"min\":6,\"max\":60,\"step\":1,\"description\":\"How fast that spring settles. Under about 15 the icons keep bobbing after the pointer has left, which is charming once and irritating thereafter.\"},{\"name\":\"labels\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Fade the item's label in over the magnified item. Its opacity is driven by the same distance the size is, so it arrives with the swell instead of on a separate hover timer.\"},{\"name\":\"orientation\",\"kind\":\"enum\",\"default\":\"horizontal\",\"options\":[\"horizontal\",\"vertical\"],\"description\":\"Which axis the dock runs along, and therefore which pointer coordinate drives it. Items always grow away from the dock's own edge, so a vertical rail expands sideways rather than upward.\"},{\"name\":\"accent\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"Running indicator and focus ring. The ring is a shadow rather than an outline — an outline paints outside the border box and visibly lags the spring while the button is still resizing.\"}]},\"next\":{\"slug\":\"live-activity\",\"name\":\"LiveActivity\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-10-01\",\"pro\":false,\"description\":\"A live activity tracker in one black shape. A timer, a download, a delivery, a song and an AI agent take turns in it, and tapping it opens a full card. The text fades out before the shape moves and comes back after it stops, so it never stretches during the resize. The small pill and the big card share one clock and one state, so if you pause in the card, the pill is paused too. The agent is the main show. Three sparkles circle on a tilted orbit, the front one big and the back ones small, and they spin faster on every new step. The pill widens to show each new step's name, then shrinks back to the step count, and the card types out the command the agent is running.\",\"dependencies\":[\"motion\",\"lucide-react\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Morph\",\"Layout animation\",\"Spring\",\"Bounce\",\"Crossfade\",\"Blur\",\"Interruptible animation\",\"Press / Tap feedback\",\"Tabular numbers\",\"Number ticker\",\"Skeleton / Shimmer\",\"Typewriter\",\"Reduced motion\"],\"pausable\":true,\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/live-activity/live-activity.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/live-activity/activities.tsx\",\"role\":\"peer\",\"label\":\"activities.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"},\"$22:props:children:props:entry:variants:1\"],\"props\":[{\"name\":\"activity\",\"kind\":\"enum\",\"default\":\"agent\",\"options\":[\"media\",\"timer\",\"download\",\"delivery\",\"agent\"],\"description\":\"Which activity holds the island. Changing it morphs the shell straight to that activity's pill and switches the cycle off — a hand-picked activity that a timer replaces four seconds later was never really picked.\",\"sets\":{\"prop\":\"autoCycle\",\"value\":false}},{\"name\":\"autoCycle\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Rotate through the activities on a timer. The rotation stands still while the island is expanded, hovered or holding focus — nothing should change under a pointer that is about to tap it. Switching it off returns the island to `activity`, so the control and the island never disagree.\"},{\"name\":\"cycleInterval\",\"kind\":\"number\",\"default\":4,\"min\":2,\"max\":10,\"step\":0.5,\"unit\":\"s\",\"description\":\"How long each activity holds the island before the next takes over. Under about three seconds there is no time to read the number before it becomes a different one.\",\"disabledWhen\":{\"prop\":\"autoCycle\",\"equals\":false}},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":420,\"min\":100,\"max\":900,\"step\":10,\"description\":\"How hard the shell springs toward its new size. The pill-to-card swell is the largest move the island makes, so this is what decides whether it reads as a drop or a crawl.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":25,\"min\":8,\"max\":60,\"step\":1,\"description\":\"How fast the spring settles. The default leaves one small overshoot, which is what sells the shape as liquid rather than a box being resized; under about 18 it wobbles on every activity swap.\"},{\"name\":\"contentBlur\",\"kind\":\"number\",\"default\":6,\"min\":0,\"max\":16,\"step\":1,\"unit\":\"px\",\"description\":\"Blur the content dissolves through on its way in and out. It hides the frames where the outgoing and incoming views overlap; at 0 the swap reads as a plain crossfade.\"},{\"name
