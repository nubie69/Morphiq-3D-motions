:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

\",\"style\":\"tailwind\",\"file\":\"components/registry/tether/tether.tsx\"},\"$22:props:children:props:entry:variants:1\"],\"props\":[{\"name\":\"side\",\"kind\":\"enum\",\"default\":\"bottom\",\"options\":[\"top\",\"right\",\"bottom\",\"left\"],\"description\":\"Preferred side. The transform origin is derived from the side the panel actually resolved to, never this one — a flip that keeps the requested origin grows the panel away from the trigger it just moved to.\"},{\"name\":\"align\",\"kind\":\"enum\",\"default\":\"center\",\"options\":[\"start\",\"center\",\"end\"],\"description\":\"Where the panel sits along that side. It moves the origin and the caret together, so a start-aligned panel below the trigger grows down and to the right out of the button's left corner.\"},{\"name\":\"offset\",\"kind\":\"number\",\"default\":10,\"min\":0,\"max\":32,\"step\":1,\"unit\":\"px\",\"description\":\"Gap between trigger and panel. Padding rather than margin: a pointer crossing the gap on its way into a hover-opened panel never leaves the component, so the panel does not close under the cursor.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":520,\"min\":120,\"max\":900,\"step\":10,\"description\":\"Spring tension on the pop. High enough to feel like the panel is already there by the time the eye arrives.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":26,\"min\":8,\"max\":60,\"step\":1,\"description\":\"Spring friction. A little overshoot is the pop; too little and the panel wobbles, which on a menu reads as unresponsive rather than lively.\"},{\"name\":\"popScale\",\"kind\":\"number\",\"default\":0.86,\"min\":0.3,\"max\":1,\"step\":0.02,\"description\":\"Size the panel grows from. At 1 the origin work is invisible and the entrance is a plain fade — worth setting once to see what the rest of the component is buying.\"},{\"name\":\"arrow\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Caret on the tethered edge. It sits where the panel is anchored, so it stays pointing at the trigger through a side change without any repositioning code.\"},{\"name\":\"flip\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Move to the opposite side when the preferred one would overflow the viewport. The fit test reads the panel's layout box rather than its bounding rect, because the rect carries the entrance scale and would decide using a box smaller than the one about to be there.\"},{\"name\":\"openOn\",\"kind\":\"enum\",\"default\":\"click\",\"options\":[\"click\",\"hover\"],\"description\":\"What opens the panel. Click also moves focus into it; hover deliberately does not, and answers focus on the trigger instead so the keyboard is not locked out of a pointer-only affordance.\"},{\"name\":\"closeDelay\",\"kind\":\"number\",\"default\":140,\"min\":0,\"max\":800,\"step\":10,\"unit\":\"ms\",\"disabledWhen\":{\"prop\":\"openOn\",\"equals\":\"click\"},\"description\":\"Grace period before a hover-opened panel closes. The timer also refuses to fire while focus is still inside, so a pointer wandering off cannot destroy the element someone is tabbing through.\"},{\"name\":\"radius\",\"kind\":\"number\",\"default\":10,\"min\":0,\"max\":20,\"step\":1,\"unit\":\"px\",\"description\":\"Panel corner radius.\"},{\"name\":\"accentColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The rule on the tethered edge and the caret. Both move with a flip, so the panel keeps pointing back at its origin on whichever side it ended up.\"}]},\"next\":{\"slug\":\"crossing\",\"name\":\"Crossing\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-08-06\",\"description\":\"A gallery-to-detail crossing on the View Transitions API, where one element is the same object in both views.\",\"dependencies\":[\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"View transition\",\"Page transition\",\"Shared element transition\",\"Crossfade\",\"Morph\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/c
