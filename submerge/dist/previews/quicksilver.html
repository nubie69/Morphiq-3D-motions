:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

that does not exist, built out of the surface normal: sharp softbox edges, a conductor's Fresnel wash, thin-film iridescence, and a wake that keeps moving where you dragged.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Idle animation\",\"Hover effect\",\"Compositing\",\"Hardware acceleration\"],\"pausable\":true,\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/quicksilver/quicksilver.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"flowSpeed\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"How fast the surface churns. At zero the metal sets, and a still frame is the only honest way to see how much of what you are looking at is the height field and how much is the light sitting on it.\"},{\"name\":\"warp\",\"kind\":\"number\",\"default\":0.55,\"min\":0,\"max\":1.5,\"step\":0.05,\"description\":\"How far the noise drags its own coordinates before it is sampled again. Low is rolled sheet metal; past about one the surface folds back through itself and stops reading as a liquid at all.\"},{\"name\":\"stir\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":3,\"step\":0.1,\"unit\":\"×\",\"description\":\"How hard the pointer drags the metal. Eight recent impulses are kept alive at once, each with its own direction and age, which is why this leaves a wake rather than a dent — and why the whole component still costs one pass and no render target.\"},{\"name\":\"viscosity\",\"kind\":\"number\",\"default\":0.6,\"min\":0.05,\"max\":1,\"step\":0.05,\"description\":\"How long a stir survives after the pointer has left. Low is mercury and settles almost before you have finished the gesture; high holds the wake long enough that you can write in it.\"},{\"name\":\"fresnel\",\"kind\":\"number\",\"default\":2.2,\"min\":0.5,\"max\":6,\"step\":0.1,\"description\":\"Schlick exponent on the rim response. Low mirrors the whole surface evenly and reads as painted plastic; high keeps the bright reflection at the grazing angles, which is where metal actually puts it.\"},{\"name\":\"iridescence\",\"kind\":\"number\",\"default\":0.45,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Thin-film interference over the reflection, and the whole difference between chrome and oil on water. The hue comes from the film's optical thickness over the viewing cosine, so it tracks the surface angle instead of being a rainbow painted across the panel.\"},{\"name\":\"roughness\",\"kind\":\"number\",\"default\":0.18,\"min\":0,\"max\":1,\"step\":0.02,\"description\":\"How soft the reflected studio edges are. This is not a blur: a rough conductor reflects the same room over a wider cone, so what widens is the light-to-dark transition. Zero is a mirror and shows every artefact in the height field, and a little roughness is what lets procedural metal survive being looked at closely.\"},{\"name\":\"tint\",\"kind\":\"color\",\"default\":\"#c8d2e0\",\"description\":\"The base metal. Conductors tint what they reflect, and this washes out toward white at the grazing angles rather than staying constant — which is the part most fake chrome gets wrong.\"},{\"name\":\"sheenColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The colour carried by the grazing-angle sheen.\"},{\"name\":\"backgroundColor\",\"kind\":\"color\",\"default\":\"#05060a\",\"description\":\"The floor of the reflected environment, and what the vignette falls away to — so the panel edge reads as the room ending rather than as a mask laid over it.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"turing\",\"name\":\"Turing\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-08-06\",\"description\":\"Gray-Scott reaction-diffusion on the GPU. Two reagents, four terms, and coral, labyrinths and colonies that settle and stop all fall out of the arithmetic. A background that grows rather than loops, and never reaches the same frame twice.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Idle animation\",\"Hover effect\",\"Compositing\",\"Frame rate (FPS)\"],\"pausable\":true,\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/turing/turing.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"feed\",\"kind\":\"number\",\"default\":0.05,\"min\":0.01,\"max\":0.09,\"step\":0.001,\"description\":\"Rate at which fresh reagent arrives everywhere. Feed and kill together pick the creature, and these coordinates were measured rather than inherited: 0.050/0.062 keeps colonising and is the default, 0.030/0.062 settles into stable spots and then genuinely stops, 0.039/0.058 floods to a dense labyrinth, and 0.022/0.051 oscillates without ever settling. Push feed past about 0.055 at this kill and the colonies die outright — the living band is a few thousandths wide, which is why the step is this fine.\"},{\"name\":\"kill\",\"kind\":\"number\",\"default\":0.062,\"min\":0.045,\"max\":0.07,\"step\":0.001,\"description\":\"Rate at which the reacted product is removed. Pull it down and the pattern floods until it fills the plate; push it up and it starves back to nothing. The edge of the living band is a cliff rather than a slope, so this control does nothing and then does everything.\"},{\"name\":\"diffusion\",\"kind\":\"number\",\"default\":1,\"min\":0.4,\"max\":1.4,\"step\":0.02,\"description\":\"How fast the substrate spreads relative to the activator, which is held at half. One is the canonical two-to-one. Turing's result is that a perfectly uniform system develops structure the moment one reagent outruns the other; this is that ratio, and below about 0.6 there is nothing to see because nothing outruns anything.\"},{\"name\":\"steps\",\"kind\":\"number\",\"default\":16,\"min\":1,\"max\":32,\"step\":1,\"description\":\"Solver iterations per displayed frame, and the only reason this is watchable. The pattern needs a couple of thousand steps before it is worth looking at; at one step per frame that is most of a minute of staring at dots. Sixteen gets there in seconds and looks identical on arrival, because this is a time-scale control rather than a quality one. It is also the honest performance dial — every step is a full pass over the grid.\"},{\"name\":\"gridSize\",\"kind\":\"enum\",\"default\":\"512\",\"options\":[\"256\",\"384\",\"512\",\"768\"],\"description\":\"Resolution of the simulation grid, deliberately held apart from the canvas — a window drag resizes only the display pass, so dragging the browser never wipes a pattern that took thirty seconds to grow. Bigger is finer filigree over the same area, not more area.\"},{\"name\":\"seed\",\"kind\":\"enum\",\"default\":\"spots\",\"options\":[\"spots\",\"ring\",\"stripe\",\"noise\"],\"description\":\"How the plate is inoculated. Each one ends up somewhere different at identical feed and kill, which is the honest demonstration that this system has no single attractor — the initial condition is a real parameter, not a formality.\"},{\"name\":\"brush\",\"kind\":\"number\",\"default\":26,\"min\":4,\"max\":80,\"step\":2,\"unit\":\"px\",\"description\":\"Radius the pointer inoculates. Measured against the grid rather than the canvas, so the blob covers the same share of the pattern on a narrow strip as on a full page. The dose is one impulse per frame regardless of how many solver steps run, so this control and the step count stay independent.\"},{\"name\":\"sharpness\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Where the palette ramp cuts the continuous field. The chemistry is smooth everywhere; coral does not look like coral until you cut it, and this is the cut. At zero you are looking at the raw concentration, which is the most informative view and the least striking one.\"},{\"name\":\"colorLow\",\"kind\":\"color\",\"default\":\"#0a0a12\",\"description\":\"The plate, where nothing has taken hold.\"},{\"name\":\"colorHigh\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The colony. The membrane picks it up too, at a third strength, so the boundary reads as the same organism rather than as an outline drawn around it.\"}]},\"next\":{\"slug\":\"mycelium\",\"name\":\"Mycelium\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-08-13\",\"pausable\":true,\"description\":\"A slime mould foraging in the dark. Every other field here is a differential equation on a grid. This one is a population: up to a million agents, each carrying a position and a heading, sampling the trail ahead of itself, turning toward whatever smells strongest and laying down more of it as it goes. The veins, the junctions and the slow reorganisation are nowhere in the code.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Idle animation\",\"Hover effect\",\"Hardware acceleration\",\"Compositing\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/mycelium/mycelium.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"agentCount\",\"kind\":\"enum\",\"default\":\"1M\",\"options\":[\"65k\",\"262k\",\"1M\"],\"description\":\"How many agents forage the field, in discrete steps rather than on a slider — each value reallocates the state textures and rebuilds the point geometry, which a slider would do on every pixel of a drag. Against a fixed 1024px field this is a density: a million closes the web into fine reticulation, and a quarter of that is the same behaviour drawn as a few sparse trunks. Step down if the frame rate needs it.\"},{\"name\":\"speed\",\"kind\":\"number\",\"default\":55,\"min\":5,\"max\":300,\"step\":5,\"unit\":\"px\",\"description\":\"Forward travel per second, against the 1024px field. Push it far past the sensor distance and an agent steps clean over a vein without ever sensing it — the colony looks fast and builds nothing.\"},{\"name\":\"sensorDistance\",\"kind\":\"number\",\"default\":7,\"min\":1,\"max\":40,\"step\":0.5,\"unit\":\"px\",\"description\":\"How far ahead the three sensors sit, measured against the trail map rather than the canvas so the structure holds its scale on a narrow strip. Short is myopic and knots; long lets an agent commit to a vein it can already see.\"},{\"name\":\"sensorAngle\",\"kind\":\"number\",\"default\":24,\"min\":5,\"max\":60,\"step\":1,\"unit\":\"°\",\"description\":\"How far off its heading an agent looks when it samples left and right. This one control decides the topology: narrow makes long parallel veins that rarely meet, wide makes a dense web that merges everywhere. Past about 45° both flanks read the same trail and the colony loses its ability to choose.\"},{\"name\":\"turnSpeed\",\"kind\":\"number\",\"default\":24,\"min\":1,\"max\":60,\"step\":1,\"description\":\"How sharply an agent can steer, in radians per second. The interesting band is where this is just under what the sensor angle asks for, so agents are always slightly behind the decision they have made. Too low and they cannot follow their own trail at all.\"},{\"name\":\"wander\",\"kind\":\"number\",\"default\":13,\"min\":0,\"max\":30,\"step\":0.5,\"description\":\"Random walk added to every heading, in radians per second — exploration against exploitation. Trail-following is pure positive feedback, so at zero the colony converges onto two or three trunk roads within a minute and the rest of the field goes black. This is the noise that keeps leaking agents into empty space, where they seed the next generation of branches.\"},{\"name\":\"decay\",\"kind\":\"number\",\"default\":0.97,\"min\":0.85,\"max\":0.995,\"step\":0.005,\"description\":\"Fraction of the trail surviving each 60th of a second — the colony's memory. Below about 0.95 nothing persists long enough for a second agent to find it and no structure forms; above 0.995 every path ever taken stays lit and the map fogs over.\"},{\"name\":\"diffuse\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Blend toward the blurred neighbourhood. Diffusion is what lets a vein be found from beside it rather than only from on it — at zero the trails are one texel wide, invisible to a sensor not already on them, and nothing ever aggregates.\"},{\"name\":\"deposit\",\"kind\":\"number\",\"default\":0.03,\"min\":0.005,\"max\":0.3,\"step\":0.005,\"description\":\"Trail laid down by one agent in one step. Against decay this is the whole economy — a cell settles at deposit over one-minus-decay, so the pair decides whether open ground stays dark while the veins pin bright, or the entire field saturates into one flat sheet.\"},{\"name\":\"attract\",\"kind\":\"number\",\"default\":0.6,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Strength of the food source under the pointer. It is laid into the trail map rather than applied as a force, so the colony has to find it and route to it over several seconds — the veins thicken toward your cursor the way they would toward an oat flake, instead of the swarm snapping to it. 0 turns it off.\"},{\"name\":\"spawn\",\"kind\":\"enum\",\"default\":\"scatter\",\"options\":[\"ring\",\"scatter\",\"disc\"],\"description\":\"Where the population starts and which way it faces. Scatter is uniform and low-density, so the web self-organises within a couple of seconds. Ring faces inward and has to resolve its own collision first — slower to settle, and the only one where you can watch the first branches being forced.\"},{\"name\":\"trailColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The trail itself.\"},{\"name\":\"background\",\"kind\":\"color\",\"default\":\"#07060c\",\"description\":\"The dark the network grows against.\"},{\"name\":\"glow\",\"kind\":\"number\",\"default\":0.8,\"min\":0,\"max\":2,\"step\":0.05,\"description\":\"Extra light on the densest strands, where several trails have piled onto the same cell.\"}]},\"index\":19,\"total\":137},\"controlsLocked\":\"$@2b\"}]}]\n"])</script><script>self.__next_f.push([1,"25:null\n"])</script><script>self.__next_f.push([1,"29:[[\"$\",\"title\",\"0\",{\"children\":\"Quicksilver :: Fullscreen :: Motion Garden\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Molten chrome. Every other shader background emits light. This one reflects a studio that does not exist, built out of the surface normal: sharp softbox edges, a conductor's Fresnel wash, thin-film iridescence, and a wake that keeps moving where you dragged.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Motion Garden\"}],[\"$\",\"link\",\"3\",{\"rel\":\"author\",\"href\":\"https://shadow-garden-ui.vercel.app\"}],[\"$\",\"meta\",\"4\",{\"name\":\"author\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"5\",{\"name\":\"keywords\",\"content\":\"react animation components,react component library,animated react components,framer motion components,webgl background react,next.js components,tailwind components,react ui components,motion design system,typescript react components,ai coding agent components,claude code components,cursor react components,llm-ready react components,llms.txt\"}],[\"$\",\"meta\",\"6\",{\"name\":\"creator\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"7\",{\"name\":\"publisher\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"8\",{\"name\":\"robots\",\"content\":\"noindex, follow\"}],[\"$\",\"link\",\"9\",{\"rel\":\"canonical\",\"href\":\"https://shadow-garden-ui.vercel.app/components/quicksilver/full\"}],[\"$\",\"meta\",\"10\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:title\",\"content\":\"Animated React components, ready for your coding agent :: Motion Garden\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:de
