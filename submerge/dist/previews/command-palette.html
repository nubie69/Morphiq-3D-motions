:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

tkey trigger.\",\"dependencies\":[\"cmdk\",\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Enter / Exit\",\"Scale in\",\"Blur\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/command-palette/command-palette.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/ui/auto-mask-vertical.tsx\",\"role\":\"peer\",\"label\":\"auto-mask-vertical.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"lib/utils.ts\",\"role\":\"util\",\"label\":\"utils.ts\"}],\"props\":[{\"name\":\"hotkey\",\"kind\":\"enum\",\"default\":\"cmd+k\",\"options\":[\"cmd+k\",\"ctrl+k\",\"/\"],\"description\":\"Shortcut that opens the palette. cmd+k falls back to Ctrl+K on non-Apple platforms.\"},{\"name\":\"loop\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Wrap keyboard selection at the list ends.\"},{\"name\":\"glass\",\"kind\":\"boolean\",\"default\":false,\"description\":\"Liquid-glass surface instead of a solid panel.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"live-activity\",\"name\":\"LiveActivity\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-10-01\",\"pro\":false,\"description\":\"A live activity tracker in one black shape. A timer, a download, a delivery, a song and an AI agent take turns in it, and tapping it opens a full card. The text fades out before the shape moves and comes back after it stops, so it never stretches during the resize. The small pill and the big card share one clock and one state, so if you pause in the card, the pill is paused too. The agent is the main show. Three sparkles circle on a tilted orbit, the front one big and the back ones small, and they spin faster on every new step. The pill widens to show each new step's name, then shrinks back to the step count, and the card types out the command the agent is running.\",\"dependencies\":[\"motion\",\"lucide-react\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Morph\",\"Layout animation\",\"Spring\",\"Bounce\",\"Crossfade\",\"Blur\",\"I l-to-card swell is the largest move the island makes, so this is what decides whether it reads as a drop or a crawl.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":25,\"min\":8,\"max\":60,\"step\":1,\"description\":\"How fast the spring settles. The default leaves one small overshoot, which is what sells the shape as liquid rather than a box being resized; under about 18 it wobbles on every activity swap.\"},{\"name\":\"contentBlur\",\"kind\":\"number\",\"default\":6,\"min\":0,\"max\":16,\"step\":1,\"unit\":\"px\",\"description\":\"Blur the content dissolves through on its way in and out. It hides the frames where the outgoing and incoming views overlap; at 0 the swap reads as a plain crossfade.\"},{\"name\":\"accent\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"Progress rings, the download bar, the agent's working state and the focus outline. The timer and delivery keep their own tints so you can tell the activities apart at a glance.\"}]},\"next\":{\"slug\":\"physics-engine\",\"name\":\"PhysicsEngine\",\"category\":\"Power-User Systems\",\"addedAt\":\"2026-07-18\",\"pausable\":true,\"description\":\"A from-scratch 2D rigid-body physics lab. Fixed-timestep impulse solver, drag-to-throw bodies, force and velocity overlays, and a live energy readout on a blueprint grid.\",\"cookbook\":[\"Drag\",\"Momentum\",\"Velocity\",\"Mass\",\"Bounce\",\"Frame rate (FPS)\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/physics-engine/physics-engine.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\"}],\"props\":[{\"name\":\"scene\",\"kind\":\"enum\",\"default\":\"playground\",\"options\":[\"playground\",\"stack\",\"wrecking-ball\",\"projectile\"],\"description\":\"Preset world. Switching rebuilds the scene deterministically from a fixed seed.\"},{\"name\":\"gravity\",\"kind\":\"number\",\"default\":9.8,\"min\":0,\"max\":30,\"step\":0.1,\"unit\":\"m/s²\",\"descri
