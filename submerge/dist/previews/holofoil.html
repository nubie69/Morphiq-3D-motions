:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

tilt while the specular follows it, and the flake only lights where the rainbow currently falls, which is what stops the whole thing reading as one gradient sliding around.\",\"dependencies\":[],\"cookbook\":[\"Hover effect\",\"3D tilt / Flip\",\"Perspective\",\"Idle animation\",\"Compositing\",\"Hardware acceleration\"],\"pausable\":true,\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/holofoil/holofoil.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"maxTilt\",\"kind\":\"number\",\"default\":14,\"min\":0,\"max\":30,\"step\":1,\"unit\":\"°\",\"description\":\"Maximum lean at the card's edge. The tilt is only the carrier here — set it to zero and the foil still moves, because the bands are driven by pointer position rather than by the rotation.\"},{\"name\":\"perspective\",\"kind\":\"number\",\"default\":800,\"min\":300,\"max\":2400,\"step\":50,\"unit\":\"px\",\"description\":\"Depth of the projection. Lower exaggerates the lean; the value that reads as expensive is nearly always further away than instinct suggests.\"},{\"name\":\"foil\",\"kind\":\"enum\",\"default\":\"rainbow\",\"options\":[\"rainbow\",\"reverse\",\"cosmic\",\"linear\",\"none\"],\"description\":\"Which diffraction pattern the laminate carries. Rainbow is the repeating twelve-stop spectrum a real holographic sheet produces — it repeats rather than running one rainbow across the card. Reverse runs it the other way so the band travels against the tilt, which is what most people actually recognise as foil.\"},{\"name\":\"foilIntensity\",\"kind\":\"number\",\"default\":0.75,\"min\":0,\"max\":1.5,\"step\":0.05,\"disabledWhen\":{\"prop\":\"foil\",\"equals\":\"none\"},\"description\":\"Strength of the diffraction band. Past about one it stops being laminate and starts being a sticker.\"},{\"name\":\"sparkle\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1.5,\"step\":0.05,\"description\":\"Density of the flake. It is masked by the diffraction band rather than laid over the card, and that coupling is the entire reason the specks read as suspended inside the laminate instead of as dust on your screen.\"},{\"name\":\"glare\",\"kind\":\"number\",\"default\":0.45,\"min\":0,\"max\":1.2,\"step\":0.05,\"description\":\"The broad specular band, kept separate from the foil on purpose. Foil is diffraction and moves against the tilt; glare is reflection and follows it. Running both, opposed, is what gives the surface a material.\"},{\"name\":\"idleDrift\",\"kind\":\"number\",\"default\":0.2,\"min\":0,\"max\":1,\"step\":0.05,\"unit\":\"×\",\"description\":\"How much the foil keeps moving with no pointer on it, on two incommensurate rates so the idle never settles into an obvious period. A card in a case is never quite still, and a completely dead card in a grid reads as an image rather than an object.\"},{\"name\":\"settle\",\"kind\":\"number\",\"default\":0.12,\"min\":0.02,\"max\":0.5,\"step\":0.01,\"description\":\"Seconds the card takes to catch up to the pointer. Near zero it is welded to the cursor and reads as a texture map; too high and it lags far enough that the foil stops feeling attached to your hand.\"},{\"name\":\"blendMode\",\"kind\":\"enum\",\"default\":\"color-dodge\",\"options\":[\"color-dodge\",\"screen\",\"overlay\",\"hard-light\",\"plus-lighter\"],\"description\":\"How the foil composites onto whatever you wrapped. Colour-dodge behaves like real foil — it blows out where the card is already bright and does almost nothing in the shadows. Screen is the safe one on a light card.\"},{\"name\":\"sheenColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The colour carried by the specular sheen.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"reorder\",\"name\":\"Reorder\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-08-06\",\"description\":\"A sortable list that answers to a finger and to a keyboard equally. Grab a row, and the rest step aside to make the space.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Drag to reorder\",\"Drag\",\"Layout animation\",\"Spring\",\"Press / Tap feedback\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/reorder/reorder.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"lib/utils.ts\",\"role\":\"util\",\"label\":\"utils.ts\"}],\"props\":[{\"name\":\"axis\",\"kind\":\"enum\",\"default\":\"y\",\"options\":[\"y\",\"x\"],\"description\":\"Which way the list runs, and which arrow keys move a row.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":520,\"min\":120,\"max\":900,\"step\":10,\"description\":\"Spring tension as the displaced rows close up. This is the only motion in the component that is not under your finger, so it is the one that decides whether the list feels attached to the drag.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":38,\"min\":8,\"max\":60,\"step\":1,\"description\":\"Spring friction on the same.\"},{\"name\":\"handle\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Restrict the drag to the grip. Off makes the whole row the surface, which is quicker to hit and costs you text selection and a scroll gesture that starts on a row.\"},{\"name\":\"lift\",\"kind\":\"number\",\"default\":1.03,\"min\":1,\"max\":1.15,\"step\":0.01,\"description\":\"Scale of a row while it is off the ground. Past about 1.06 the row stops reading as lifted and starts reading as a different row.\"},{\"name\":\"liftShadow\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Shadow cast under a lifted row.\"},{\"name\":\"gap\",\"kind\":\"number\",\"default\":8,\"min\":0,\"max\":24,\"step\":1,\"unit\":\"px\",\"description\":\"Space between rows.\"},{\"name\":\"radius\",\"kind\":\"number\",\"default\":8,\"min\":0,\"max\":20,\"step\":1,\"unit\":\"px\",\"description\":\"Row corner radius.\"},{\"name\":\"density\",\"kind\":\"enum\",\"default\":\"comfortable\",\"options\":[\"comfortable\",\"compact\"],\"description\":\"Row padding.\"},{\"name\":\"showIndex\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Print the position of each row. Worth leaving on wherever the order is the data rather than a preference — it is the only on-screen confirmation that a keyboard move landed where the announcement said it did.\"},{\"name\":\"accentColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"Grip tint, and the outline on a row the keyboard is carrying. A pointer drag shows itself by moving; a keyboard grab has to be drawn.\"}]},\"next\":{\"slug\":\"lens\",\"name\":\"Lens\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-08-06\",\"description\":\"A glass lens you drag across live content, bending it through an SVG displacement field with a real bevel and three-channel dispersion. It refracts a live duplicate of its own children rather than the page backdrop, which is the only version of this effect that works in Chrome, Safari and Firefox alike.\",\"dependencies\":[],\"cookbook\":[\"Drag\",\"Momentum\",\"Rubber-banding\",\"Damping\",\"Blur\",\"Mask\",\"Hardware acceleration\"],\"pausable\":true,\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/lens/lens.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"size\",\"kind\":\"number\",\"default\":45,\"min\":10,\"max\":90,\"step\":1,\"unit\":\"%\",\"description\":\"Diameter of the disc, measured against the shorter side of whatever it is dropped into rather than in pixels — so the glass keeps its proportion in a wide hero and in a narrow column alike, and can never outgrow the box on either axis. The displacement map is rasterised once at a fixed resolution and stretched to fit, so dragging this is cheap; regenerating a bitmap per frame would cost far more than the pixels are worth.\"},{\"name\":\"refraction\",\"kind\":\"number\",\"default\":0.55,\"min\":0,\"max\":1.5,\"step\":0.05,\"description\":\"How far the map pushes the content, and the one number this component is about. It runs through the filter property on a live duplicate rather than through backdrop-filter, because backdrop-filter with an SVG reference is Chromium-only — and CSS.supports reports true in WebKit and Gecko too, so the capability cannot even be detected honestly.\"},{\"name\":\"edgeThickness\",\"kind\":\"number\",\"default\":0.3,\"min\":0.05,\"max\":0.8,\"step\":0.05,\"description\":\"How much of the radius is bevel. Real glass does nearly all of its bending in the last fifth, which is why displacing evenly across the whole disc gives a soap bubble rather than a lens.\"},{\"name\":\"blur\",\"kind\":\"number\",\"default\":0,\"min\":0,\"max\":20,\"step\":0.5,\"unit\":\"px\",\"description\":\"Softening behind the glass, and it ships at zero on purpose. Blur is the fastest way to make a lens look like a smudge — real glass is sharpest dead centre, so anything past about three stops being an optic and becomes a frosted coaster you cannot read through. At zero the blur is dropped from the filter list rather than written as blur(0px), which would still buy a render surface for no visible effect.\"},{\"name\":\"chromatic\",\"kind\":\"number\",\"default\":0.22,\"min\":0,\"max\":1.5,\"step\":0.05,\"description\":\"Separation between the three channels' displacement — three real passes, isolated by colour matrices and recombined additively. Scaled by the disc rather than fixed in pixels, so the same setting is the same optic at any size. Glass disperses; a single pass with a tinted edge is a smear pretending to be physics.\"},{\"name\":\"magnify\",\"kind\":\"number\",\"default\":1.6,\"min\":0.8,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"Scale applied to the content inside the disc. It is a real transform rather than a displacement, because displacement can only resample pixels that are already there — faking magnification with it softens the entire window, which is exactly what makes most browser lenses read as a smear. Below one it is a fisheye pushed the wrong way: a real optic, and one that looks broken to everyone who is not an optician.\"},{\"name\":\"shimmer\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":1.5,\"step\":0.05,\"description\":\"Speed of the specular travelling the rim. It is the only thing here that moves on its own, and it is what stops a parked lens looking like a screenshot.\"},{\"name\":\"friction\",\"kind\":\"number\",\"default\":0.9,\"min\":0.75,\"max\":0.99,\"step\":0.01,\"description\":\"How much of a throw survives, applied per second rather than per frame so the same flick coasts the same distance on a 60Hz and a 120Hz display.\"},{\"name\":\"bounded\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Which box holds the lens in, and what it is looking at. On, it stays inside its container and magnifies a live duplicate of the children you handed it. Off, it is portalled to the body and bound to the viewport instead — dropping the container's own clip is not enough, because any ancestor that clips wins and on a real page there is always one — and what it magnifies becomes the whole page. Either boundary resists and reverses rather than stopping dead; a thrown object that halts against an invisible wall reads as a bug rather than as a boundary. The page is duplicated for real, because no browser API lets an element read arbitrary rendered content: backdrop-filter cannot magnify and is Chromium-only. That copy is a snapshot rather than a live tree, re-taken on every grab, so it cannot carry a running animation, canvas pixels or component state.\"},{\"name\":\"rimColor\",\"kind\":\"color\",\"default\":\"#e9e6ff\",\"description\":\"The colour of the rim highlight, masked to the outermost two pixels so it reads as the lit edge of the glass instead of a ring drawn on top of it.\"}]},\"index\":83,\"total\":137},\"controlsLocked\":\"$@2b\"}]}]\n"])</script><script>self.__next_f.push([1,"25:null\n"])</script><script>self.__next_f.push([1,"29:[[\"$\",\"title\",\"0\",{\"children\":\"Holofoil :: Fullscreen :: Motion Garden\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Holographic trading-card foil over real content. The diffraction band travels against the tilt while the specular follows it, and the flake only lights where the rainbow currently falls, which is what stops the whole thing reading as one gradient sliding around.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Motion Garden\"}],[\"$\",\"link\",\"3\",{\"rel\":\"author\",\"href\":\"https://shadow-garden-ui.vercel.app\"}],[\"$\",\"meta\",\"4\",{\"name\":\"author\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"5\",{\"name\":\"keywords\",\"content\":\"react animation components,react component library,animated react components,framer motion components,webgl background react,next.js components,tailwind components,react ui components,motion design system,typescript react components,ai coding agent components,claude code components,cursor react components,llm-ready react components,llms.txt\"}],[\"$\",\"meta\",\"6\",{\"name\":\"creator\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"7\",{\"name\":\"publisher\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"8\",{\"name\":\"robots\",\"content\":\"noindex, follow\"}],[\"$\",\"link\",\"9\",{\"rel\":\"canonical\",\"href\":\"https://shadow-garden-ui.vercel.app/components/holofoil/full\"}],[\"$\",\"meta\",\"10\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:title\",\"content\":\"Animated React components, ready for your coding agent :: Motion Garden\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:description\",\"content\":\"Animated React and Next.js components you can tune live, each with a
