:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

ism: wide open at 64% of the housing, past the centre and light-tight at zero, cutting the scalloped polygon a real iris makes on the way through.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Reveal\",\"Rotate\",\"Clip-path\",\"Orchestration\",\"Bounce\",\"Ease-in-out\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/aperture/aperture.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"lib/utils.ts\",\"role\":\"util\",\"label\":\"utils.ts\"}],\"props\":[{\"name\":\"bladeCount\",\"kind\":\"number\",\"default\":8,\"min\":3,\"max\":12,\"step\":1,\"description\":\"How many leaves in the mechanism. Low counts give the hard hexagonal bokeh of a cheap lens; past nine the opening is indistinguishable from a circle, which is exactly what expensive glass is sold on.\"},{\"name\":\"openness\",\"kind\":\"number\",\"default\":0.62,\"min\":0,\"max\":1,\"step\":0.01,\"disabledWhen\":{\"prop\":\"autoOpen\",\"equals\":true},\"description\":\"Where the blades rest, 0 shut to 1 wide. At 0 they cross past the centre rather than merely meeting it — an iris that only just touches leaks light.\"},{\"name\":\"duration\",\"kind\":\"number\",\"default\":900,\"min\":150,\"max\":2500,\"step\":50,\"unit\":\"ms\",\"description\":\"Time for one full open or close.\"},{\"name\":\"detent\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Overshoot as the mechanism seats. 0 arrives dead, which reads as software; a little bounce reads as a part with mass hitting its stop.\"},{\"name\":\"bladeCurvature\",\"kind\":\"number\",\"default\":1,\"min\":0.6,\"max\":1.4,\"step\":0.02,\"unit\":\"×\",\"description\":\"Curvature of each blade's inner edge. The mechanism is derived from the opening range, so this bends the leaf without touching the travel: flatter blades cut a rounder, more regular polygon, tighter ones pull the scallop corners out into a star.\"},{\"name\":\"edgeHighlight\",\"kind\":\"number\",\"default\":0.6,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Strength of the seam along each leaf's inner edge, and of the bezel. Each seam is cut by the leaf that lies over it — named rather than left to the drawing order, because a leaf stack is a ring and painter's order is a line. That is what puts exactly one line at every corner of the opening, wide open and shut alike.\"},{\"name\":\"housingInset\",\"kind\":\"number\",\"default\":6,\"min\":0,\"max\":24,\"step\":1,\"description\":\"Width of the machined ring inside the rim. It is drawn over the blades, so the housing reads as the part they are seated in rather than one more leaf.\"},{\"name\":\"autoOpen\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Open and shut on a loop. Turning it off hands the mechanism to the openness slider.\"},{\"name\":\"bladeColor\",\"kind\":\"color\",\"default\":\"#26232c\",\"description\":\"Body of the blades, the housing, and the barrel floor behind them. Its own material rather than a themed surface — a light theme must not put a white ring around a lens.\"},{\"name\":\"edgeColor\",\"kind\":\"color\",\"default\":\"#000000\",\"description\":\"Amethyst on the blade seams and the bezel.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"hold\",\"name\":\"Hold\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-07-31\",\"description\":\"A confirm that has to be earned. The ring fills while you hold, snaps shut when it commits, and empties on a different curve entirely if you let go early.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Hold to confirm\",\"Asymmetric easing\",\"Press / Tap feedback\",\"Interruptible animation\",\"Ease-out\",\"Purposeful animation\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/hold/hold.tsx\"},\"$22:props:children:props:entry:variants:1\"],\"props\":[{\"name\":\"duration\",\"kind\":\"number\",\"default\":1200,\"min\":300,\"max\":4000,\"step\":50,\"unit\":\"ms\",\"description\":\"How long a full press has to be held before it commits. Under about 600ms people let go by reflex; past 2s they assume it is broken.\"},{\"name\":\"indicator\",\"kind\":\"enum\",\"default\":\"ring\",\"options\":[\"ring\",\"bar\",\"fill\"],\"description\":\"Where the progress lives — a ring traced around the glyph, a bar under the control, or the control's own face flooding left to right.\"},{\"name\":\"threshold\",\"kind\":\"number\",\"default\":0.92,\"min\":0.6,\"max\":1,\"step\":0.01,\"description\":\"Fraction of the track that counts as committed. Below 1 the last sliver closes itself, so the press lands a beat before the eye expects it — that early snap is what makes it feel decisive rather than punctual.\"},{\"name\":\"rewindRate\",\"kind\":\"number\",\"default\":2.4,\"min\":0.5,\"max\":6,\"step\":0.1,\"unit\":\"×\",\"description\":\"How much faster a cancelled hold empties than it filled. At 1 it rewinds the same tape; above 2 the release reads as a spring letting go, which is the entire point of an asymmetric curve.\"},{\"name\":\"strokeWidth\",\"kind\":\"number\",\"default\":3,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"px\",\"disabledWhen\":{\"prop\":\"indicator\",\"equals\":\"fill\"},\"description\":\"Weight of the progress track. Thin reads as instrumentation, thick reads as a toy.\"},{\"name\":\"holdScale\",\"kind\":\"number\",\"default\":0.96,\"min\":0.85,\"max\":1,\"step\":0.01,\"unit\":\"×\",\"description\":\"How far the control sinks under the finger. The press feedback is doing more work here than the ring is — take it to 1 and the hold stops feeling physical.\"},{\"name\":\"commitScale\",\"kind\":\"number\",\"default\":1.06,\"min\":1,\"max\":1.3,\"step\":0.01,\"unit\":\"×\",\"description\":\"Overshoot the control pops to at the instant of commit, before settling. This is the receipt.\"},{\"name\":\"successHold\",\"kind\":\"number\",\"default\":1.4,\"min\":0.4,\"max\":4,\"step\":0.2,\"unit\":\"s\",\"description\":\"How long the confirmed state stays on screen before the control re-arms itself.\"},{\"name\":\"accentColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"Amethyst of the filling track and the confirmed state.\"},{\"name\":\"trackColor\",\"kind\":\"color\",\"default\":\"#2a2136\",\"description\":\"The unfilled remainder. Keep it close to the surface underneath — a high-contrast track turns the ring into a bullseye.\"}]},\"next\":{\"slug\":\"segmented\",\"name\":\"Segmented\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-08-06\",\"description\":\"A segmented control whose indicator travels on a shared layout id and smears in the direction it is moving.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Direction-aware transition\",\"Layout animation\",\"Squash & stretch\",\"Velocity\",\"Spring\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/segmented/segmented.tsx\"},\"$22:props:children:props:entry:variants:1\"],\"props\":[{\"name\":\"indicator\",\"kind\":\"enum\",\"default\":\"solid\",\"options\":[\"solid\",\"outline\",\"underline\"],\"description\":\"How the active segment is marked. All three are the same travelling element at different settings — the shared layout id does not change, so switching between them costs no extra animation code.\"},{\"name\":\"sizing\",\"kind\":\"enum\",\"default\":\"auto\",\"options\":[\"auto\",\"equal\"],\"description\":\"Auto sizes each segment to its label, so the indicator resizes as well as travels — the half of the FLIP that equal-width tabs never show. Equal splits the row evenly and fills the container.\"},{\"name\":\"density\",\"kind\":\"enum\",\"default\":\"comfortable\",\"options\":[\"comfortable\",\"compact\"],\"description\":\"Padding and type size. Compact is the toolbar setting; it shortens the travel too, which is why the smear reads more subtly there.\"},{\"name\":\"radius\",\"kind\":\"number\",\"default\":8,\"min\":0,\"max\":20,\"step\":1,\"unit\":\"px\",\"description\":\"Corner radius of the indicator and the segments. motion corrects the radius through the layout animation, so a rounded indicator does not go oval while it is resizing.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":520,\"min\":120,\"max\":900,\"step\":10,\"description\":\"Spring tension on the travel. It also drives the proxy spring the deformation is read from, so the smear stays in phase with the movement at every setting rather than at the one it was tuned on.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":34,\"min\":8,\"max\":60,\"step\":1,\"description\":\"Spring friction. Low lets the indicator ring past the segment and come back, which the smear follows in both directions; high arrives dead and barely deforms at all.\"},{\"name\":\"smear\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How hard the travel deforms the indicator. The stretch is along the direction of movement and anchored at the leading edge, so it trails behind rather than running ahead. Zero is a rigid box that slides.\"},{\"name\":\"glow\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Accent bloom under the indicator. It travels with the box and takes the same deformation, so it reads as light coming off the thing rather than a separate shape following it.\"},{\"name\":\"accentColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The indicator, its bloom, and the label of the active segment when the indicator is not filling it.\"}]},\"index\":77,\"total\":137},\"controlsLocked\":\"$@2b\"}]}]\n"])</script><script>self.__next_f.push([1,"25:null\n"])</script><script>self.__next_f.push([1,"29:[[\"$\",\"title\",\"0\",{\"children\":\"Aperture :: Fullscreen :: Motion Garden\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A camera iris. Blades pivot on a ring of pins and one shared angle drives the whole mechanism: wide open at 64% of the housing, past the centre a
