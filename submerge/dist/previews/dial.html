:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

her than in React state, because a drag writes it sixty times a second and a spring more often than that, so the only thing React holds is the detent index, and only when that integer actually changes. Arrow keys step through the same spring the hand does, so the keyboard is not a second, worse path to the same control.\",\"dependencies\":[\"motion\"],\"cookbook\":[\"Drag\",\"Momentum\",\"Velocity\",\"Spring\",\"Stiffness / Tension\",\"Damping\",\"Interruptible animation\",\"Stepped animation\",\"Rotate\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/dial/dial.tsx\"}],\"props\":[{\"name\":\"detents\",\"kind\":\"number\",\"default\":12,\"min\":2,\"max\":36,\"step\":1,\"description\":\"Stops across the sweep. This is the resolution of the control and it changes how the drag feels as much as how it reads: few stops far apart give a decisive click between settings, many close together give something closer to a continuous ramp with a texture.\"},{\"name\":\"sweep\",\"kind\":\"number\",\"default\":270,\"min\":90,\"max\":360,\"step\":10,\"unit\":\"°\",\"description\":\"Angular range, centred on twelve o'clock. Two hundred and seventy is the instrument convention because it leaves a visible gap at the bottom — the eye reads the gap as the end of the scale, so both limits are legible without a label. At a full turn there are no ends to see.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":380,\"min\":50,\"max\":900,\"step\":10,\"description\":\"How hard the spring pulls toward the chosen stop after release. High makes a knob that arrives the instant you let go; low makes one with weight, where a flick keeps travelling for a moment after the finger is gone.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":26,\"min\":5,\"max\":60,\"step\":1,\"description\":\"How much of that spring's energy is absorbed. Below about fifteen the knob overshoots its stop and comes back, which reads as a loose detent rather than a machined one.\"},{\"name\":\"inertia\",\"kind\":\"number\",\"default\":0.6,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How far a flick carries past the point the hand let go. The throw is projected first and the nearest stop chosen second, so a fast spin travels several detents and settles — at zero the knob stops at whichever stop it happened to be passing, which throws the whole gesture away.\"},{\"name\":\"detentPull\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Magnetism felt during the drag itself, before any release. The pull falls off toward the midpoint between two stops, so the exact centre is an unstable point the knob slides off rather than a flat spot it can rest in — which is what makes a detent feel like a notch instead of a suggestion.\"},{\"name\":\"ticks\",\"kind\":\"enum\",\"default\":\"line\",\"options\":[\"line\",\"dot\",\"none\"],\"description\":\"How the stops are marked on the panel around the knob. The scale never turns with the pointer — a mark that moves with the thing it is measuring tells you nothing about where you are.\"},{\"name\":\"readout\",\"kind\":\"boolean\",\"default\":true,\"description\":\"The value under the knob, set in tabular figures so the number does not shuffle sideways as it counts.\"},{\"name\":\"accent\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The lit tick, the pointer line, and the live half of the readout.\"},{\"name\":\"size\",\"kind\":\"number\",\"default\":160,\"min\":96,\"max\":280,\"step\":4,\"unit\":\"px\",\"description\":\"Knob diameter. Everything inside is drawn against a fixed grid and scaled, so the knurling, the bevel and the pointer keep their proportions at any size.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"passcode\",\"name\":\"Passcode\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-08-13\",\"description\":\"A one-time-code field whose cells answer every keystroke. Each character lands compressed and springs back, a paste distributes across the row rather than filling it on one frame, a wrong code shakes and clears itself, and a right one folds the whole row into a tick. Underneath there is exactly one real input holding the whole code, which is what keeps SMS autofill, password managers, select-all and a screen reader working. None of those survive six inputs with maxLength one.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Spring\",\"Stiffness / Tension\",\"Anticipation\",\"Scale\",\"Pop in\",\"Stagger\",\"Shake / Wiggle\",\"Morph\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/passcode/passcode.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"lib/utils.ts\",\"role\":\"util\",\"label\":\"utils.ts\"}],\"props\":[{\"name\":\"length\",\"kind\":\"number\",\"default\":6,\"min\":4,\"max\":8,\"step\":1,\"description\":\"Cells in the code. Six is the industry default because it is about the longest string most people can hold in working memory between reading it and typing it — the control exists so you can feel where that stops being true.\"},{\"name\":\"mode\",\"kind\":\"enum\",\"default\":\"numeric\",\"options\":[\"numeric\",\"alphanumeric\"],\"description\":\"What the field accepts. Numeric also asks for the number pad, which matters far more on a phone than the validation does — an alphanumeric code field that opens a full keyboard costs the user two taps every single time.\"},{\"name\":\"mask\",\"kind\":\"boolean\",\"default\":false,\"description\":\"Render dots instead of characters. Off by default on purpose: a one-time code is worthless a minute after it arrives, and masking it only stops the person entitled to read it from checking their own typing.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":520,\"min\":120,\"max\":900,\"step\":10,\"description\":\"Spring tension of the per-character pop. High enough to land inside the gap between two fast keystrokes, or the cells queue up behind a quick typist and the feedback arrives after the character it is confirming.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":26,\"min\":8,\"max\":60,\"step\":1,\"description\":\"Spring friction. Low rings past and settles, which is the difference between a cell that acknowledges a keystroke and one that merely updates.\"},{\"name\":\"anticipation\",\"kind\":\"number\",\"default\":0.12,\"min\":0,\"max\":0.4,\"step\":0.01,\"description\":\"How far a cell compresses before it springs back. A brief gather in the opposite direction is what makes the pop read as the cell reacting rather than as the cell being resized — at zero it is a plain overshoot and noticeably flatter.\"},{\"name\":\"pasteStagger\",\"kind\":\"number\",\"default\":45,\"min\":0,\"max\":200,\"step\":5,\"unit\":\"ms\",\"description\":\"Delay between cells as a pasted or autofilled code distributes. Zero fills every cell on one frame, which is honest and reads as a glitch; the stagger turns an instantaneous state change into something the eye can follow.\"},{\"name\":\"shakeAmplitude\",\"kind\":\"number\",\"default\":10,\"min\":0,\"max\":24,\"step\":1,\"unit\":\"px\",\"description\":\"Lateral travel of the rejection. It moves the whole row rather than the cells individually — a row that shakes has been judged, a set of cells that each shake looks broken.\"},{\"name\":\"autoSubmit\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Judge the code the moment the last cell fills instead of waiting for a button. Correct when a wrong answer costs nothing; wrong the instant it does.\"},{\"name\":\"submitDelay\",\"kind\":\"number\",\"default\":220,\"min\":0,\"max\":800,\"step\":20,\"unit\":\"ms\",\"disabledWhen\":{\"prop\":\"autoSubmit\",\"equals\":false},\"description\":\"Pause between the last character landing and the verdict. It exists so the final cell finishes its own pop before the row is judged — validating on the same frame steals the confirmation of the keystroke that caused it, and the user never learns their last character registered.\"},{\"name\":\"accentColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The focused cell's ring, the filled border, the caret, and the success tick.\"},{\"name\":\"errorColor\",\"kind\":\"color\",\"default\":\"#f87171\",\"description\":\"The rejection. It takes the cell borders rather than flooding the fills, so the code you typed stays readable while you are being told it is wrong.\"}]},\"next\":{\"slug\":\"refract\",\"name\":\"Refract\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-08-21\",\"pausable\":true,\"description\":\"A frosted-glass slab you drag across a live scene, refracting it through a real shader optic. A rounded-rect height field bends three separately-sampled color channels along its gradient, with a Fresnel-bright rim, a travelling specular streak, and a frost that is a genuine multi-tap blur of what sits beneath the pane. Where Lens bends its DOM children through an SVG displacement map and magnifies, Refract is a flat pane over a scene texture with true angle-of-incidence refraction, dispersion and glare, and the scene it bends is drawn in the same shader, because no browser lets WebGL read the rendered page. Throw it and it glides on momentum, rubber-banding off the container walls.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Drag\",\"Momentum\",\"Blur\",\"Loop\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/refract/refract.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"ior\",\"kind\":\"number\",\"default\":0.18,\"min\":0,\"max\":0.6,\"step\":0.01,\"description\":\"Refraction strength at the bevel. The flat middle passes almost straight through, exactly like a real pane.\"},{\"name\":\"dispersion\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"R/G/B sample spread — the chromatic fringe that gathers on the bevel.\"},{\"name\":\"frost\",\"kind\":\"number\",\"default\":6,\"min\":0,\"max\":20,\"step\":0.5,\"unit\":\"px\",\"description\":\"Blur radius under the glass.\"},{\"name\":\"edgeWidth\",\"kind\":\"number\",\"default\":0.18,\"min\":0.05,\"max\":0.5,\"step\":0.01,\"description\":\"Fraction of the slab that is bevel — all of the bending and most of the glare lives there.\"},{\"name\":\"glare\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Fresnel rim and travelling specular strength.\"},{\"name\":\"slabWidth\",\"kind\":\"number\",\"default\":46,\"min\":20,\"max\":80,\"step\":1,\"unit\":\"%\",\"description\":\"Slab width as a fraction of the container.\"},{\"name\":\"scene\",\"kind\":\"enum\",\"default\":\"blobs\",\"options\":[\"blobs\",\"stripes\",\"checker\"],\"description\":\"The procedural backdrop being refracted. High-frequency scenes show the dispersion hardest.\"},{\"name\":\"tint\",\"kind\":\"color\",\"default\":\"#e9e6ff\",\"description\":\"Glass body tint.\"}]},\"index\":86,\"total\":137},\"controlsLocked\":\"$@2b\"}]}]\n"])</script><script>self.__next_f.push([1,"25:null\n"])</script><script>self.__next_f.push([1,"29:[[\"$\",\"title\",\"0\",{\"children\":\"Dial :: Fullscreen :: Motion Garden\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A machined rotary knob: angular drag with detents you can feel on the way past, inertia on a flick, and a spring that settles into the nearest stop. The angle lives in a motion value rather than in React state, because a drag writes it sixty times a second and a spring more often than that, so the only thing React holds is the detent index, and only when that integer actually changes. Arrow keys step through the same spring the hand does, so the keyboard is not a second, worse path to the same control.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Motion Garden\"}],[\"$\",\"link\",\"3\",{\"rel\":\"author\",\"hr
