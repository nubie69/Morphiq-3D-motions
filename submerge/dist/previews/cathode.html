:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

d\":\"color\",\"default\":\"#a855f7\",\"description\":\"Amethyst core of the flame.\"},{\"name\":\"flameColor\",\"kind\":\"color\",\"default\":\"#630475\",\"description\":\"Dark body of the black flame.\"},{\"name\":\"backgroundColor\",\"kind\":\"color\",\"default\":\"#05010a\",\"description\":\"The void the flame rises against.\"},{\"name\":\"speed\",\"kind\":\"number\",\"default\":0.6,\"min\":0,\"max\":3,\"step\":0.05,\"unit\":\"×\",\"description\":\"Rise speed of the flame.\"},{\"name\":\"warp\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":2,\"step\":0.05,\"description\":\"Domain-warp turbulence folding the flame.\"},{\"name\":\"detail\",\"kind\":\"number\",\"default\":4,\"min\":1,\"max\":6,\"step\":1,\"description\":\"Number of noise octaves.\"},{\"name\":\"shimmer\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":2,\"step\":0.05,\"description\":\"Rising heat-shimmer distortion.\"},{\"name\":\"height\",\"kind\":\"number\",\"default\":0.95,\"min\":0.2,\"max\":1.6,\"step\":0.05,\"description\":\"How far up the frame the flame reaches. Above 1 the taper never completes inside the frame, so the flame runs off the top edge instead of dying out.\"},{\"name\":\"grain\",\"kind\":\"number\",\"default\":0.05,\"min\":0,\"max\":0.3,\"step\":0.01,\"description\":\"Film grain over the field.\"},{\"name\":\"flameWidth\",\"kind\":\"number\",\"default\":1.6,\"min\":0.3,\"max\":2,\"step\":0.05,\"description\":\"Horizontal spread of the flame.\"},{\"name\":\"sparkCount\",\"kind\":\"number\",\"default\":60,\"min\":0,\"max\":200,\"step\":5,\"description\":\"Number of rising fire sparks (0 turns them off).\"},{\"name\":\"sparkSize\",\"kind\":\"number\",\"default\":1.2,\"min\":0.5,\"max\":3,\"step\":0.1,\"unit\":\"px\",\"description\":\"Size of each rising spark.\"},{\"name\":\"sparkSpeed\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":3,\"step\":0.05,\"unit\":\"×\",\"description\":\"Rise speed of the sparks.\"}]},\"next\":{\"slug\":\"turing\",\"name\":\"Turing\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-08-06\",\"description\":\"Gray-Scott reaction-diffusion on the GPU. Two reagents, four terms, and coral, labyrinths and colonies that settle and stop all fall out of the arithmetic. A background that grows rather than loops, and never reaches the same frame twice.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Idle animation\",\"Hover effect\",\"Compositing\",\"Frame rate (FPS)\"],\"pausable\":true,\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/turing/turing.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"feed\",\"kind\":\"number\",\"default\":0.05,\"min\":0.01,\"max\":0.09,\"step\":0.001,\"description\":\"Rate at which fresh reagent arrives everywhere. Feed and kill together pick the creature, and these coordinates were measured rather than inherited: 0.050/0.062 keeps colonising and is the default, 0.030/0.062 settles into stable spots and then genuinely stops, 0.039/0.058 floods to a dense labyrinth, and 0.022/0.051 oscillates without ever settling. Push feed past about 0.055 at this kill and the colonies die outright — the living band is a few thousandths wide, which is why the step is this fine.\"},{\"name\":\"kill\",\"kind\":\"number\",\"default\":0.062,\"min\":0.045,\"max\":0.07,\"step\":0.001,\"description\":\"Rate at which the reacted product is removed. Pull it down and the pattern floods until it fills the plate; push it up and it starves back to nothing. The edge of the living band is a cliff rather than a slope, so this control does nothing and then does everything.\"},{\"name\":\"diffusion\",\"kind\":\"number\",\"default\":1,\"min\":0.4,\"max\":1.4,\"step\":0.02,\"description\":\"How fast the substrate spreads relative to the activator, which is held at half. One is the canonical two-to-one. Turing's result is that a perfectly uniform system develops structure the moment one reagent outruns the other; this is that ratio, and below about 0.6 there is nothing to see because nothing outruns anything.\"},{\"name\":\"steps\",\"kind\":\"number\",\"default\":16,\"min\":1,\"max\":32,\"step\":1,\"description\":\"Solver iterations per displayed frame, and the only reason this is watchable. The pattern needs a couple of thousand steps before it is worth looking at; at one step per frame that is most of a minute of staring at dots. Sixteen gets there in seconds and looks identical on arrival, because this is a time-scale control rather than a quality one. It is also the honest performance dial — every step is a full pass over the grid.\"},{\"name\":\"gridSize\",\"kind\":\"enum\",\"default\":\"512\",\"options\":[\"256\",\"384\",\"512\",\"768\"],\"description\":\"Resolution of the simulation grid, deliberately held apart from the canvas — a window drag resizes only the display pass, so dragging the browser never wipes a pattern that took thirty seconds to grow. Bigger is finer filigree over the same area, not more area.\"},{\"name\":\"seed\",\"kind\":\"enum\",\"default\":\"spots\",\"options\":[\"spots\",\"ring\",\"stripe\",\"noise\"],\"description\":\"How the plate is inoculated. Each one ends up somewhere different at identical feed and kill, which is the honest demonstration that this system has no single attractor — the initial condition is a real parameter, not a formality.\"},{\"name\":\"brush\",\"kind\":\"number\",\"default\":26,\"min\":4,\"max\":80,\"step\":2,\"unit\":\"px\",\"description\":\"Radius the pointer inoculates. Measured against the grid rather than the canvas, so the blob covers the same share of the pattern on a narrow strip as on a full page. The dose is one impulse per frame regardless of how many solver steps run, so this control and the step count stay independent.\"},{\"name\":\"sharpness\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"Where the palette ramp cuts the continuous field. The chemistry is smooth everywhere; coral does not look like coral until you cut it, and this is the cut. At zero you are looking at the raw concentration, which is the most informative view and the least striking one.\"},{\"name\":\"colorLow\",\"kind\":\"color\",\"default\":\"#0a0a12\",\"description\":\"The plate, where nothing has taken hold.\"},{\"name\":\"colorHigh\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The colony. The membrane picks it up too, at a third strength, so the boundary reads as the same organism rather than as an outline drawn around it.\"}]},\"index\":17,\"total\":137},\"controlsLocked\":\"$@2b\"}]}]\n"])</script><script>self.__next_f.push([1,"25:null\n"])</script><script>self.__next_f.push([1,"29:[[\"$\",\"title\",\"0\",{\"children\":\"Cathode :: Fullscreen :: Motion Garden\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A cathode-ray tube slowed down until you can watch it work: the beam paints a test card line by line, and the phosphor it leaves behind fades until the next pass comes round.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Motion Garden\"}],[\"$\",\"link\",\"3\",{\"rel\":\"author\",\"href\":\"https://shadow-garden-ui.vercel.app\"}],[\"$\",\"meta\",\"4\",{\"name\":\"author\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"5\",{\"name\":\"keywords\",\"content\":\"react animation components,react component library,animated react components,framer motion components,webgl background react,next.js components,tailwind components,react ui components,motion design system,typescript react components,ai coding agent components,claude code components,cursor react components,llm-ready react components,llms.txt\"}],[\"$\",\"meta\",\"6\",{\"name\":\"creator\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"7\",{\"name\":\"publisher\",\"content\":\"Motion Garden\"}],[\"$\",\"meta\",\"8\",{\"name\":\"robots\",\"content\":\"noindex, follow\"}],[\"$\",
