:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

nimation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"position\",\"kind\":\"enum\",\"default\":\"bottom\",\"options\":[\"bottom\",\"top\"],\"description\":\"Which edge the horizon lies along. Bottom rises off a footer; top flips the whole field so the light hangs down from a header, and the pointer pull follows it.\"},{\"name\":\"horizon\",\"kind\":\"number\",\"default\":0,\"min\":0,\"max\":0.8,\"step\":0.01,\"description\":\"How far the horizon sits from its edge, as a fraction of the height. 0 lays it on the edge itself, so a border or hairline reads as the horizon; move it in and dark ground opens up behind it.\"},{\"name\":\"curvature\",\"kind\":\"number\",\"default\":0,\"min\":0,\"max\":1,\"step\":0.01,\"description\":\"How far the horizon bows down toward the corners. The light follows it, so the glow tapers off at the sides.\"},{\"name\":\"reach\",\"kind\":\"number\",\"default\":1,\"min\":0.4,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"How high the smoke climbs off the horizon.\"},{\"name\":\"speed\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":3,\"step\":0.05,\"unit\":\"×\",\"description\":\"Drift rate of the smoke. Accumulated per frame, so retuning it never jumps the field.\"},{\"name\":\"intensity\",\"kind\":\"number\",\"default\":1,\"min\":0.2,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"Density of the smoke, and with it the brightness.\"},{\"name\":\"pull\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How hard the plume leans toward the pointer and climbs to meet it. 0 leaves it drifting on its own.\"},{\"name\":\"coreColor\",\"kind\":\"color\",\"default\":\"#e9d5ff\",\"description\":\"The dense heart of the smoke and the rim on the horizon.\"},{\"name\":\"hazeColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The thin smoke at the edges, where the light fades into the sky.\"},{\"name\":\"skyColor\",\"kind\":\"color\",\"default\":\"#07060b\",\"description\":\"The sky behind the light. The smoke blends mostly as light, so it wants a dark sky to read.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"voronoi-shatter\",\"name\":\"VoronoiShatter\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-09-18\",\"pro\":false,\"pausable\":true,\"description\":\"Lit cells that fracture apart under the pointer and knit back together behind it. The seam is drawn from the gap between the two nearest seeds rather than the distance to the nearest one, so it holds an even width right through the vertices where three cells meet — and the shatter displaces the space rather than the seeds, so no cell ever swaps neighbours mid-fracture.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Pulse\",\"Hover effect\",\"Interpolation / Tween\",\"Hardware acceleration\",\"Reduced motion\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/voronoi-shatter/voronoi-shatter.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"density\",\"kind\":\"number\",\"default\":9,\"min\":3,\"max\":30,\"step\":1,\"description\":\"Cells across the frame. The 3×3 neighbour search runs per pixel regardless, so this changes the look and not the cost — the only knob here that is free.\"},{\"name\":\"drift\",\"kind\":\"number\",\"default\":0.28,\"min\":0,\"max\":0.5,\"step\":0.01,\"description\":\"How far each seed orbits its resting point, in cell widths. An orbit rather than a translation: it is bounded by construction, so the seed can never leave its own cell and the lattice cannot tear however high this goes.\"},{\"name\":\"seamWidth\",\"kind\":\"number\",\"default\":0.06,\"min\":0.005,\"max\":0.25,\"step\":0.005,\"description\":\"Thickness of the lit boundary. Widened by the local derivative before it is thresholded, so a seam running diagonally across a pixel is filtered rather than stepped.\"},{\"name\":\"seamGlow\",\"kind\":\"number\",\"default\":0.6,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"Bloom carried from the seam out into the cells. This is what makes the cells read as panes with light behind them rather than as flat tiles with a line between them.\"},{\"name\":\"shatter\",\"kind\":\"number\",\"default\":0.45,\"min\":0,\"max\":2,\"step\":0.05,\"description\":\"How hard the field is pushed apart under the pointer. At 0 the surface is intact and the component is an ambient cell field; past about 1.2 the near cells stretch far enough to read as smears rather than as panes.\"},{\"name\":\"shatterRadius\",\"kind\":\"number\",\"default\":0.35,\"min\":0.05,\"max\":1.5,\"step\":0.05,\"description\":\"Reach of the push, as a fraction of frame height. Falls off on a Gaussian — a linear falloff has a hard outer edge that reads as a second circular seam nobody asked for.\"},{\"name\":\"cellContrast\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How much cell-to-cell brightness varies. Keyed to the seed's own hash rather than to the search order, so a cell holds its shade for the whole session instead of flickering as the seeds move past each other.\"},{\"name\":\"seamColor\",\"kind\":\"color\",\"default\":\"#e9d5ff\",\"description\":\"The boundaries, and the bloom they cast into the cells.\"},{\"name\":\"cellColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"What a fully-lit cell grades toward from the background.\"},{\"name\":\"backgroundColor\",\"kind\":\"color\",\"default\":\"#08050e\",\"description\":\"The field behind the cells. Its own material rather than a themed surface, for the same reason every full-bleed background here is.\"}]},\"next\":{\"slug\":\"morphing-text\",\"attribution\":{\"name\":\"React Bits\",\"url\":\"https://reactbits.dev\"},\"name\":\"MorphingText\",\"category\":\"Text Animations\",\"addedAt\":\"2026-07-16\",\"description\":\"A gooey blur-mo
