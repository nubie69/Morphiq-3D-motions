:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

cross the frame. Low values give a few slow, room-sized sheets of light; high values pack the frame with a fine mesh that starts to read as texture rather than as water.\"},{\"name\":\"speed\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"How fast the field flows. At 0 the pattern holds still and stays a legible backdrop; the loop keeps running, so the pointer still pushes it.\"},{\"name\":\"depth\",\"kind\":\"number\",\"default\":3,\"min\":1,\"max\":5,\"step\":1,\"description\":\"Octaves contributing to the network. Each one costs a full warped noise lookup, so this is the performance knob. Contribution falls at the same rate frequency climbs, so adding an octave adds detail without brightening the frame.\"},{\"name\":\"ripple\",\"kind\":\"number\",\"default\":3.2,\"min\":1,\"max\":8,\"step\":0.1,\"description\":\"Exponent on the folded ridge. This is what separates caustics from clouds: raising it thins the filaments and concentrates the light into them without softening an edge, which no brightness threshold can do.\"},{\"name\":\"refraction\",\"kind\":\"number\",\"default\":0.85,\"min\":0,\"max\":3,\"step\":0.05,\"description\":\"How far the field is displaced through a copy of itself before folding. At 0 the network is a fixed pattern sliding past; the branching and reconnecting people read as water is entirely this.\"},{\"name\":\"brightness\",\"kind\":\"number\",\"default\":1.35,\"min\":0.2,\"max\":2.5,\"step\":0.05,\"unit\":\"×\",\"description\":\"Gain on the filaments. Above 1 the ramp starts reaching its second stop, so the cores take the glow colour and the network gains a hot centre rather than simply getting paler.\"},{\"name\":\"pointerInfluence\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":3,\"step\":0.05,\"unit\":\"×\",\"description\":\"How far the pointer pushes the field. Smoothed toward the cursor rather than tracking it exactly, so a jumped pointer never snaps the whole network sideways.\"},{\"name\":\"inkColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"Body of a filament — the colour the network reads as.\"},{\"name\":\"glowColor\",\"kind\":\"color\",\"default\":\"#e9d5ff\",\"description\":\"Core of a filament, reached only where the light concentrates past full. Two stops rather than one: a single ramp toward one bright colour flattens the network into a wire diagram.\"},{\"name\":\"backgroundColor\",\"kind\":\"color\",\"default\":\"#08050e\",\"description\":\"The water itself. Its own material rather than a themed surface — a full-bleed background that flips to white under a light theme is not a background, it is a flash.\"}]},\"neighbors\":{\"prev\":{\"slug\":\"flock-field\",\"name\":\"FlockField\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-09-18\",\"pro\":false,\"pausable\":true,\"description\":\"A murmuration of hundreds of boids wheeling as one — separation, alignment, and cohesion resolved every frame through a spatial hash for the crowd, banking toward or scattering from your cursor, smeared into long trails of amethyst and cyan as the flock folds across the dark.\",\"dependencies\":[],\"cookbook\":[\"Loop\",\"Idle animation\",\"Hover effect\",\"Follow-through\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/flock-field/flock-field.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"count\",\"kind\":\"number\",\"default\":300,\"min\":50,\"max\":1000,\"step\":10,\"description\":\"Number of boids in the flock. Spatial-hash lookup keeps it near-linear.\"},{\"name\":\"speed\",\"kind\":\"number\",\"default\":2.5,\"min\":0.5,\"max\":6,\"step\":0.1,\"description\":\"Maximum boid speed, px per frame.\"},{\"name\":\"separation\",\"kind\":\"number\",\"default\":1.2,\"min\":0,\"max\":3,\"step\":0.05,\"description\":\"Weight of steering away from close neighbors.\"},{\"name\":\"alignment\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":3,\"step\":0.05,\"description\":\"Weight of matching neighbors' heading.\"},{\"name\":\"cohesion\",\"kind\":\"number\",\"default\":1,\"min\":0,\"max\":3,\"step\":0.05,\"description\":\"Weight of steering toward the neighbor center of mass.\"},{\"name\":\"neighborRadius\",\"kind\":\"number\",\"default\":60,\"min\":20,\"max\":150,\"step\":5,\"unit\":\"px\",\"description\":\"How far a boid sees neighbors; sets the spatial-hash cell size.\"},{\"name\":\"separationRadius\",\"kind\":\"number\",\"default\":24,\"min\":5,\"max\":60,\"step\":1,\"unit\":\"px\",\"description\":\"Distance under which boids actively push apart.\"},{\"name\":\"cursorMode\",\"kind\":\"enum\",\"default\":\"repel\",\"options\":[\"attract\",\"repel\",\"off\"],\"description\":\"Whether the cursor draws the flock in, scatters it, or is ignored.\"},{\"name\":\"cursorForce\",\"kind\":\"number\",\"default\":1.5,\"min\":0,\"max\":5,\"step\":0.1,\"description\":\"Strength of the cursor's pull or push.\",\"disabledWhen\":{\"prop\":\"cursorMode\",\"equals\":\"off\"}},{\"name\":\"cursorRadius\",\"kind\":\"number\",\"default\":160,\"min\":40,\"max\":400,\"step\":10,\"unit\":\"px\",\"description\":\"Radius of the cursor's influence.\",\"disabledWhen\":{\"prop\":\"cursorMode\",\"equals\":\"off\"}},{\"name\":\"trail\",\"kind\":\"number\",\"default\":0.85,\"min\":0,\"max\":0.95,\"step\":0.05,\"description\":\"Motion-trail persistence — 0 is crisp, high smears long tails.\"},{\"name\":\"color1\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"Slow-boid color.\"},{\"name\":\"color2\",\"kind\":\"color\",\"default\":\"#22d3ee\",\"description\":\"Fast-boid color — boids grade between the two by speed.\"}]},\"next\":{\"slug\":\"voronoi-shatter\",\"name\":\"VoronoiShatter\",\"category\":\"Backgrounds\",\"addedAt\":\"2026-09-18\",\"pro\":false,\"pausable\":true,\"description\":\"Lit cells that fracture apart under the pointer and knit back together behind it. The seam is drawn from the gap between the two nearest seeds rather than the distance to the nearest one, so it holds an even width right through the vertices where three cells meet — and the shatter displaces the space rather than the seeds, so no cell ever swaps neighbours mid-fracture.\",\"dependencies\":[\"ogl\"],\"cookbook\":[\"Loop\",\"Pulse\",\"Hover effect\",\"Interpolation / Tween\",\"Hardware acceleration\",\"Reduced motion\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/voronoi-shatter/voronoi-shatter.tsx\"},{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"hooks/use-animation-loop.ts\",\"role\":\"hook\",\"label\":\"use-animation-loop.ts\"}],\"props\":[{\"name\":\"density\",\"kind\":\"number\",\"default\":9,\"min\":3,\"max\":30,\"step\":1,\"description\":\"Cells across the frame. The 3×3 neighbour search runs per pixel regardless, so this changes the look and not the cost — the only knob here that is free.\"},{\"name\":\"drift\",\"kind\":\"number\",\"default\":0.28,\"min\":0,\"max\":0.5,\"step\":0.01,\"description\":\"How far each seed orbits its resting point, in cell widths. An orbit rather than a translation: it is bounded by construction, so the seed can never leave its own cell and the lattice cannot tear however high this goes.\"},{\"name\":\"seamWidth\",\"kind\":\"number\",\"default\":0.06,\"min\":0.005,\"max\":0.25,\"step\":0.005,\"description\":\"Thickness of the lit boundary. Widened by the local derivative before it is thresholded, so a seam running diagonally across a pixel is filtered rather than stepped.\"},{\"name\":\"seamGlow\",\"kind\":\"number\",\"default\":0.6,\"min\":0,\"max\":2,\"step\":0.05,\"unit\":\"×\",\"description\":\"Bloom carried from the seam out into the cells. This is what makes the cells read as panes with light behind them rather than as flat tiles with a line between them.\"},{\"name\":\"shatter\",\"kind\":\"number\",\"default\":0.45,\"min\":0,\"max\":2,\"step\":0.05,\"description\":\"How hard the field is pushed apart under the pointer. At 0 the surface is intact and the component is an ambient cell field; past about 1.2 the near cells stretch far enough to read as smears rather than as panes.\"},{\"name\":\"shatterRadius\",\"kind\":\"number\",\"default\":0.35,\"min\":0.05,\"max\":1.5,\"step\":0.05,\"description\":\"Reach of the push, as a fraction of frame height. Falls off on a Gaussian — a linear falloff has a hard outer edge that reads as a second circular seam nobody asked for.\"},{\"name\":\"cellContrast\",\"kind\":\"number\",\"default\":0.35,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How much cell-to-cell brightness varies. Keyed to the seed's own hash rather than to the search order, so a cell holds its shade for the whole session instead of flickering as the seeds move past each other.\"},{\"name\":\"seamColor\",\"kind\":\"color\",\"default\":\"#e9d5ff\",\"description\":\"The boundaries, and the bloom they cast into the cells.\"},{\"name\":\"cellColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"What a fully-lit cell grades toward from the background.\"},{\"name\":\"backgroundColor\",\"kind\":\"color\",\"default\":\"#08050e\",\"description\":\"The field behind the cells. Its own material rather than a themed surface, for the same reason every full-bleed background here is.\"}]},\"index\":31,\"total\":137},\"controlsLocked\":\"$@2b\"}]}]\n25:null\n29:[[\"$\",\"title\",\"0\",{\"children\":\"Caustics :: Fullscreen :: Motion Garden\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Light through moving water. The filaments are the zero crossings of a noise field folded back on itself, not its peaks :: which is why they stay thin and hard-edged at any brightness instead of blooming into blobs. The lattice is periodic, so the flow offset wraps and the motion never coarsens over a long session.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Motion Garde
