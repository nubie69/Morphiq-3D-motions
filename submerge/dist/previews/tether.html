:root {
  --bprogress-color: linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-height: 3px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%), 0 0 5px linear-gradient(90deg, #f754f1 0%, #6d28d9 50%, #22d3ee 100%);
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

rection it is moving.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Direction-aware transition\",\"Layout animation\",\"Squash & stretch\",\"Velocity\",\"Spring\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/segmented/segmented.tsx\"},\"$22:props:children:props:entry:variants:1\"],\"props\":[{\"name\":\"indicator\",\"kind\":\"enum\",\"default\":\"solid\",\"options\":[\"solid\",\"outline\",\"underline\"],\"description\":\"How the active segment is marked. All three are the same travelling element at different settings — the shared layout id does not change, so switching between them costs no extra animation code.\"},{\"name\":\"sizing\",\"kind\":\"enum\",\"default\":\"auto\",\"options\":[\"auto\",\"equal\"],\"description\":\"Auto sizes each segment to its label, so the indicator resizes as well as travels — the half of the FLIP that equal-width tabs never show. Equal splits the row evenly and fills the container.\"},{\"name\":\"density\",\"kind\":\"enum\",\"default\":\"comfortable\",\"options\":[\"comfortable\",\"compact\"],\"description\":\"Padding and type size. Compact is the toolbar setting; it shortens the travel too, which is why the smear reads more subtly there.\"},{\"name\":\"radius\",\"kind\":\"number\",\"default\":8,\"min\":0,\"max\":20,\"step\":1,\"unit\":\"px\",\"description\":\"Corner radius of the indicator and the segments. motion corrects the radius through the layout animation, so a rounded indicator does not go oval while it is resizing.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":520,\"min\":120,\"max\":900,\"step\":10,\"description\":\"Spring tension on the travel. It also drives the proxy spring the deformation is read from, so the smear stays in phase with the movement at every setting rather than at the one it was tuned on.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":34,\"min\":8,\"max\":60,\"step\":1,\"description\":\"Spring friction. Low lets the indicator ring past the segment and come back, which the smear follows in both directions; high arrives dead and barely deforms at all.\"},{\"name\":\"smear\",\"kind\":\"number\",\"default\":0.5,\"min\":0,\"max\":1,\"step\":0.05,\"description\":\"How hard the travel deforms the indicator. The stretch is along the direction of movement and anchored at the leading edge, so it trails behind rather than running ahead. Zero is a rigid box that slides.\"},{\"name\":\"glow\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Accent bloom under the indicator. It travels with the box and takes the same deformation, so it reads as light coming off the thing rather than a separate shape following it.\"},{\"name\":\"accentColor\",\"kind\":\"color\",\"default\":\"#a855f7\",\"description\":\"The indicator, its bloom, and the label of the active segment when the indicator is not filling it.\"}]},\"next\":{\"slug\":\"inline-edit\",\"name\":\"InlineEdit\",\"category\":\"Micro-interactions\",\"addedAt\":\"2026-08-06\",\"description\":\"Text that becomes its own input with nothing moving. One padded box, two contents, sized in CSS.\",\"dependencies\":[\"motion\",\"clsx\",\"tailwind-merge\"],\"cookbook\":[\"Morph\",\"Continuity transition\",\"Spatial consistency\"],\"variants\":[{\"lang\":\"ts\",\"style\":\"tailwind\",\"file\":\"components/registry/inline-edit/inline-edit.tsx\"},\"$22:props:children:props:entry:variants:1\"],\"props\":[{\"name\":\"commitOn\",\"kind\":\"enum\",\"default\":\"blur\",\"options\":[\"blur\",\"explicit\"],\"description\":\"Blur commits when focus leaves. Explicit grows a confirm and a cancel outside the box and treats losing focus as a cancel. Both are defensible, which is why it is a prop rather than a decision.\"},{\"name\":\"stiffness\",\"kind\":\"number\",\"default\":460,\"min\":120,\"max\":900,\"step\":10,\"description\":\"Spring tension on the border, wash and ring arriving. This is the only thing that animates — everything else is already exactly where it will be.\"},{\"name\":\"damping\",\"kind\":\"number\",\"default\":32,\"min\":8,\"max\":60,\"step\":1,\"description\":\"Spring friction on the same. Low overshoots the colour, which on a border reads as a flash rather than as bounce.\"},{\"name\":\"underline\",\"kind\":\"enum\",\"default\":\"dotted\",\"options\":[\"dotted\",\"solid\",\"none\"],\"description\":\"How the display state says it is editable. A text decoration rather than a border, because a border would have to be reserved in the editing state too — and none is the honest option for a row that already announces itself some other way.\"},{\"name\":\"padX\",\"kind\":\"number\",\"default\":8,\"min\":0,\"max\":24,\"step\":1,\"unit\":\"px\",\"description\":\"Horizontal padding. Shared by both states by construction: it lives on the shell, which never unmounts, so the two contents cannot disagree about it.\"},{\"name\":\"padY\",\"kind\":\"number\",\"default\":5,\"min\":0,\"max\":16,\"step\":1,\"unit\":\"px\",\"description\":\"Vertical padding. The one that shifts every row below it when an inline editor gets this wrong.\"},{\"name\":\"radius\",\"kind\":\"number\",\"default\":6,\"min\":0,\"max\":16,\"step\":1,\"unit\":\"px\",\"description\":\"Corner radius of the shell.\"},{\"name\":\"selectOnEdit\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Select the whole value on entering edit, so typing replaces it. Off puts the caret where the click landed, which is the right behaviour for a long value being amended rather than renamed.\"},{\"name\":\"allowEmpty\",\"kind\":\"boolean\",\"default\":false,\"description\":\"Accept an empty commit. Off puts the previous value back, on the grounds that a blank field is a mis-click far more often than an intention.\"},{\"name\":\"showPencil\",\"kind\":\"boolean\",\"default\":true,\"description\":\"Pencil on hover and keyboard focus. Absolutely positioned outside the shell — anything rendered inside it changes the width of the box the component exists to h
